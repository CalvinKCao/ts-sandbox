extends: ordinal_d3pm_staged.yaml

experiment:
  name: smoke-ordinal-d3pm
  experiment_name: smoke-ordinal-d3pm

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: ordinal_d3pm_staged
    n_samples: 32
    epochs: 1
    patience: 1

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 1
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: ordinal_d3pm

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: ordinal_d3pm

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 1
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 5
    batch_size: 2
    gmm_components: 1
    topk_max: 1
    skip_eval_visualizations: true
