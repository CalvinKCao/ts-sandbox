extends: binary_anchor_stationary_flat.yaml

experiment:
  name: binary-anchor-stationary-flat-subsets
  experiment_name: binary-anchor-stationary-flat-subsets
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    max_variates_by_dataset:
      ETTm1: 4
      weather: 4
      electricity: 4
      traffic: 4
      solar_Alabama: 2
      exchange_rate: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"
