# windows (8209 / 2785): 1× for fat-V (electricity, traffic, PeMS, solar),
# 2× for the rest. Illness omitted — national_illness (~966 rows) cannot form
# lb336 + H720 windows (use the separate illness lb104/hz60 leaf instead).
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10.yaml

geometry:
  forecast_length: 720
  horizon_stitch: overlap_avg
