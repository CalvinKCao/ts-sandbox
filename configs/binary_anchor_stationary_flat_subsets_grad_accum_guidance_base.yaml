extends: binary_anchor_stationary_flat_subsets_grad_accum_base.yaml

wandb:
  project: ts-sandbox-flat-subsets-grad-accum-guidance

experiment:
  use_guidance_channel: true
  disable_cross_attention: false

training:
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002

# iTrans 2D ghost + multivariate cross-attn; reuse flat-subset pretrain + iTrans.
phases:
  - phase: diffusion_coarse_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: staged_eval
