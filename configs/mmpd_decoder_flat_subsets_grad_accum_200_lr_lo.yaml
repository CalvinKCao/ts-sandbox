# MMPD Decoder eval on ETTh1-capped flat subsets (YAML data_subset policy).
#
# Subset ids / variate indices resolved from configs/binary_anchor_stationary_flat_subsets.yaml
# (same ETTh1-capped policy as binary flat-subset runs). No binary ckpts required.
#
# Submit (Killarney or Narval login, $SCRATCH/ts-sandbox):
#   ./submit_mmpd_decoder_flat_subsets_grad_accum_200_lr_lo.sh --smoke-test
#   ./submit_mmpd_decoder_flat_subsets_grad_accum_200_lr_lo.sh
#
# datasets/ is gitignored — submit skips any dataset CSV/NPZ missing on the cluster.

extends: binary_anchor_stationary_flat_subsets_grad_accum_200_lr_lo.yaml

experiment:
  name: mmpd-decoder-flat-subsets-grad-accum-200-lr-lo
  experiment_name: mmpd_decoder_flat_subsets_grad_accum_200_lr_lo

mmpd:
  backbone: Decoder
  subset_config: binary_anchor_stationary_flat_subsets.yaml
  lookback: 96
  horizon: 96
  datasets:
    - ETTh1
    - ETTh2
    - ETTm1
    - ETTm2
    - illness
    - exchange_rate
    - weather
    - electricity
    - traffic
    - PeMS
    - solar_Alabama
    - dalia
    - dynamic
  # Patch size: auto per dataset/horizon in eval (paper D.3); electricity/traffic use P=24 at hz96.
  patch_size_default: 12
  patch_size_wide: 24
  train_epochs: 20
  patience: 5
  learning_rate: 1.0e-4
  point_weight: 0.01
  batch_size: 32
  sample_num: 100
  num_sampling_steps: 20
  gmm_components: 10
  gmm_iterations: 10
  prior_pi_decay: 0.5
  prior_precision_shape: 100
  tune_trials: 7
  tune_epochs: 10
  tune_patience: 3
  tune_params:
    # learning_rate: [3.0e-5, 3.0e-4]   # log-uniform
    # point_weight: [0.005, 0.05]        # log-uniform; paper lambda=0.99 -> 0.01
    # dropout: 0.2                       # fixed (paper default)
    # batch_size: [8, 32]                # int; capped per-dataset in train cmd
    learning_rate: [3.0e-5, 3.0e-4]   # log-uniform
    point_weight: [0.005, 0.05]        # log-uniform; paper lambda=0.99 -> 0.01
    dropout: 0.2                       # fixed (paper default)
    batch_size: [8, 32]                # int; capped per-dataset in train cmd
  leaderboard: true
