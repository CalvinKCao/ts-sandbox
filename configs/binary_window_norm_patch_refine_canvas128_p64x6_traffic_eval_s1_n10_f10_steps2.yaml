# Eval-only canvas128 traffic: stride 1, 10% windows, 10 MC samples, 2 quad_t steps.
# Weights stay in the original job dir. Resume:
# results/eval_resume/canvas128_s1_n10_f10_steps2/
# Absolute ckpt path so this leaf works from a pre-xattn worktree.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_traffic.yaml
replace_phases: true

wandb:
  tags: [evaluation_only, canvas128, stride1, n10, f10, steps2, traffic]

experiment:
  name: binary-window-norm-patch-refine-c128-traffic-eval-s1-n10-f10-steps2
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_traffic_eval_s1_n10_f10_steps2
  seed: 42
  eval_source_checkpoint_dir: /scratch/ccao87/ts-sandbox/results/ckpts/08-04-4597055-traffic-binary_window_norm_patch_refine_canvas128_p64x6_traffic

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

phases:
  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.10
    test_stride: 1
    eval_progress_key: canvas128_s1_n10_f10_steps2
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 2
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: false
