# Same recipe as ..._patch16x4_fixed20_from_joint but lb336 / hz96.
# Geometry change ⇒ cannot reuse hz720 patch-guidance or DiT pretrain.
# Fresh synth pretrain + in-run patch guidance; fixed HPs transferred from
# joint_g_lr_batch_s30r20 (tuned at hz720 — transfer experiment).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_patch16x4_fixed20_from_joint.yaml

# Parent geometry is lb336/hz720; geometry: wins over experiment: after merge.
geometry:
  lookback_length: 336
  forecast_length: 96
  itrans_lookback_length: 336

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz96
    - uncompressed
    - vertical_dual
    - patch16x4
    - fixed_hp_from_joint_s30r20
    - train_window_aug
    - repr_t1
    - hz_transfer

experiment:
  name: binary-vd-lb336-hz96-ord-unc-p16x4-fixed20-from-joint
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz96_ordinal_norm_uncompressed_bs_mid_vertical_dual_patch16x4_fixed20_from_joint
  dit_patch_size: [16, 4]
  binary_length_mode: power
  binary_length_scale: 1.0
  binary_length_g: 1.0
  binary_length_g_by_dataset: {}

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null

  - phase: patch_guidance_finetune_hp
    # hz720 guidance pred_len is incompatible with hz96.
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 0.5
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh2:
        learning_rate: 0.0005988811135760835
        target_univariate_batch: 1024
        binary_length_g: 1.1711402938445636
      ETTm1:
        learning_rate: 0.00017383245752963103
        target_univariate_batch: 512
        binary_length_g: 5.104629857953324
      ETTm2:
        learning_rate: 0.00013298520045574457
        target_univariate_batch: 512
        binary_length_g: 7.8552492159173735
      weather:
        learning_rate: 7.62863069748409e-05
        target_univariate_batch: 2048
        binary_length_g: 2.098695399750654
      PeMS:
        learning_rate: 0.00010458207324696746
        target_univariate_batch: 512
        binary_length_g: 3.8021138287008247
      solar_Alabama:
        learning_rate: 0.00018878091236458985
        target_univariate_batch: 512
        binary_length_g: 7.483532317986583
      dynamic:
        learning_rate: 0.0014043399738332717
        target_univariate_batch: 512
        binary_length_g: 6.370356224366058
