# Optuna max_scale only; all other diffusion HPs match sweep_baseline (fixed_lr_pipeline_base).
extends: base/fixed_lr_pipeline_base.yaml

experiment:
  name: hp_max_scale_tuning

training:
  max_scale_tuning: true
  max_scale_tuning_range: [2.5, 14.0]

phases:
  - phase: diffusion_coarse_finetune_hp
    n_trials: 10
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 10
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_finer_finetune_hp
    n_trials: 10
    max_epochs: 20
    patience: 8
    search_space: lr_only
