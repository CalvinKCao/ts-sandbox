extends: base/binary_staged.yaml
experiment:
  name: hp_max_scale_tuning
training:
  max_scale_tuning: true
  max_scale_tuning_range:
  - 2.5
  - 14.0
phases:
- phase: staged_diffusion_pretrain
  phase1_config_name: binary_dual_scale
  n_samples: 10000
  epochs: 20
  patience: 4
- phase: itrans_finetune_hp
  n_trials: 10
  max_epochs: 10
  cold_start: true
- phase: diffusion_coarse_finetune_hp
  n_trials: 10
  max_epochs: 20
  patience: 8
  search_space: default
- phase: diffusion_fine_finetune_hp
  n_trials: 10
  max_epochs: 20
  patience: 8
  search_space: default
- phase: diffusion_finer_finetune_hp
  n_trials: 10
  max_epochs: 20
  patience: 8
  search_space: default
- phase: staged_eval
  eval_test_fraction: 1.0
  test_stride: 4
  n_samples: 1
  probabilistic_n_samples: 20
  tune_sampler: false
  probabilistic_sampler: dpmpp
  probabilistic_num_inference_steps: 20
  batch_size: 8
  gmm_components: 10
  topk_max: 3
  skip_eval_visualizations: true
