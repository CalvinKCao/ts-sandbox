        target_univariate_batch: 434
      ETTm1:
        learning_rate: 0.0012313680415535365
        ema_decay: 0.99
        target_univariate_batch: 434
      ETTm2:
        learning_rate: 0.00034972893955420933
        ema_decay: 0.999
        target_univariate_batch: 434
      PeMS:
        learning_rate: 8.594881594258425e-05
