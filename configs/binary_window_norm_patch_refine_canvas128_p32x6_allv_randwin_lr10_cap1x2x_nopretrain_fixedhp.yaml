phases:
  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh2:
        learning_rate: 0.0012306520272612079
        ema_decay: 0.995
        target_univariate_batch: 434
      ETTm1:
        learning_rate: 0.00034370191906144844
        ema_decay: 0.995
        target_univariate_batch: 434
      ETTm2:
        learning_rate: 0.00013282424524005128
        ema_decay: 0.98
        target_univariate_batch: 868
