# Nopre + fixed HPs: lock coarse/fine to with-pre cap1x2x Optuna bests
# (no n_trials=10 search). Same nopre semantics as *_nopretrain (no
# staged_diffusion_pretrain, from_random_init on coarse+fine).
#
# HP sources (Killarney journals under results/ckpts/08-*-*cap1x2x):
#   ETTh2  5057763  coarse#8 / fine#9
#   ETTm1  5057764  coarse#7 / fine#1
#   ETTm2  5057765  coarse#4 / fine#9
#   PeMS   5057767  coarse#1 / fine#2
#   traffic 5057769 coarse#6 / fine#3
# Dynamic with-pre fine still incomplete — omit until bests exist.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_randwin_lr10_cap1x2x_nopretrain.yaml
replace_phases: true

wandb:
  tags: [all_variates, randwin, lr10, canvas128, p32x6, win_frac_1, patch_frac_1, lr_batch_ema, anchor_every4, eval_s1_n10_steps4, patience_5, nopretrain, from_random_init, fixed_hp, withpre_best, no_optuna, hz96, caps_crops_1x2x_etth1]

experiment:
