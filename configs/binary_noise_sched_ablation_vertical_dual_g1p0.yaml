# Short vertical_dual 336/720_uncompressed schedule ablation: BASELINE g=1.0 (identity).
# Trains vertical_dual synthetic pretrain once. Patch guidance trained in-run (stride-1;
# do not reuse older "uncompressed" donors that were effectively stride-2).
# Fixed HP, ~4 epochs (same shape as binary_noise_sched_ablation_elec_unc_g*).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual.yaml

wandb:
  tags: [noise_sched_ablation, vertical_dual, uncompressed, g1p0, baseline, repr_t1]

experiment:
  name: binary-noise-sched-ablation-vertical-dual-g1p0
  experiment_name: binary_noise_sched_ablation_vertical_dual_g1p0
  binary_length_mode: none
  binary_length_g: 1.0
  binary_length_scale: 1.0
  data_subset:
    # Dynamic was 7v @ stride 60; cut both axes by ~8x for walltime.
    max_variates_by_dataset:
      dynamic: 1
    sample_stride_by_dataset:
      dynamic: 480

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 4
    patience: 4
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
