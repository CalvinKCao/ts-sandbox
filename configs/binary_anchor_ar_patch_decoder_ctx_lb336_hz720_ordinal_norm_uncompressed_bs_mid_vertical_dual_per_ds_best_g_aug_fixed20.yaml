# Fixed diffusion HP from search4_refit20 Optuna winners (Jul-14 jobs 4237795–8).
# Retrain patch guidance + vertical_dual finetune with train-window augs; no Optuna retune.
# Reuses g=1 vertical_dual synthetic pretrain.
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual.yaml

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - per_ds_best_g
    - reuse_g1_pretrain
    - fixed_hp_from_s4r20
    - train_window_aug
    - repr_t1

training:
  train_window_aug:
    enabled: true
    apply_prob: 0.5
    acf_threshold: 0.35

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-per-ds-best-g-aug-fixed20
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_per_ds_best_g_aug_fixed20
  binary_length_mode: power
  binary_length_scale: 1.0
  binary_length_g: 4.0
  binary_length_g_by_dataset:
    ETTh1: 3.0
    electricity: 8.0
    exchange_rate: 4.0
    traffic: 4.0
  data_subset:
    max_variates_by_dataset:
      dynamic: 2
    sample_stride_by_dataset:
      dynamic: 480

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_noise_sched_ablation_vertical_dual_g1p0

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 20
    search_space: fixed
    # Shared diffusion knobs; per-dataset LR + target U from Optuna winners.
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh1:
        learning_rate: 0.00017383245752963103
        target_univariate_batch: 512
        binary_length_g: 3.0
      electricity:
        learning_rate: 0.0003830550353885683
        target_univariate_batch: 1024
        binary_length_g: 8.0
      exchange_rate:
        learning_rate: 0.0003830550353885683
        target_univariate_batch: 1024
        binary_length_g: 4.0
      traffic:
        learning_rate: 9.32997981245247e-05
        target_univariate_batch: 512
        binary_length_g: 4.0

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
