extends: binary_anchor_stationary_flat_subsets_ema099.yaml

training:
  diffusion_effective_batch_multiplier: 1.5
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002

experiment:
  name: binary-anchor-stationary-flat-subsets-grad-accum-150-haar-freq
  experiment_name: binary_anchor_stationary_flat_subsets_grad_accum_150_haar_freq
  staged_representation: haar_frequency
  haar_high_freq_percent: 0.38
  haar_high_freq_levels: 0
  haar_fine_max_scale: 0.0
  haar_cutoff_heuristic: auto
  haar_fine_scale_quantile: 0.95
  haar_variance_cv_threshold: 1.0
  haar_variance_log_spread_threshold: 2.0
  haar_calibration_max_windows: 512
  window_norm_center: mean

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_finer_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only
