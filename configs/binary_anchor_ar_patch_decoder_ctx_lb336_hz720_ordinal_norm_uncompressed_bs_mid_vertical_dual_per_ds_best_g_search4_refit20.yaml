# Per-dataset best-g mid Optuna on true-stride-1 vertical_dual.
# Reuses g=1 vertical_dual pretrain (identity schedule); does NOT fresh-pretrain at g≠1.
#
# Per-dataset g:
#   Jul-14 CRPS winners: ETTh1=3, electricity=8, exchange=4, traffic=4
#   Jul-15 anchor_mse winners: ETTh2=1, ETTm1=2, ETTm2=1, weather=6, PeMS=8, solar=9
#
# Speed recipe: Optuna trials run max_epochs=4, then refit_best_max_epochs=20 retrains
# the winner from pretrain (new knobs on diffusion_*_finetune_hp).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual.yaml

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - per_ds_best_g
    - reuse_g1_pretrain
    - search4_refit20
    - lr_eff_batch_univariate
    - repr_t1

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-per-ds-best-g-s4r20
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_per_ds_best_g_search4_refit20
  binary_length_mode: power
  binary_length_scale: 1.0
  # Fallback if a dataset is missing from the map (should not happen for this submit).
  binary_length_g: 4.0
  binary_length_g_by_dataset:
    ETTh1: 3.0
    electricity: 8.0
    exchange_rate: 4.0
    traffic: 4.0
    ETTh2: 1.0
    ETTm1: 2.0
    ETTm2: 1.0
    weather: 6.0
    PeMS: 8.0
    solar_Alabama: 9.0
  data_subset:
    max_variates_by_dataset:
      dynamic: 2
    sample_stride_by_dataset:
      dynamic: 480

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_noise_sched_ablation_vertical_dual_g1p0

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 7
    max_epochs: 4
    patience: 4
    refit_best_max_epochs: 20
    refit_best_patience: 20
    search_space: lr_eff_batch_univariate
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [512, 1024, 2048]
    ema_decay: 0.995
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    binary_length_mode: power
    binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
