# APDF (one-hot columns) electricity 7v, clip-from-720 like table elec Binary.
# Seed 42 RandomState indices. Not apples-to-apples vs table 321v.
# Frozen fullT ms35 donor LRs / U=1182/1793 / max_scale 3.5 / p64x6.
# Parent all_variates:true must be cleared or merge ignores the 7-list.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_fullT_hz720_nostitch_nopretrain_fixedhp_r0_ms35_kv.yaml
replace_phases: true

wandb:
  tags: [ablation_apdf, one_hot, electricity, elec_7v_rand_s42, clip_from_720, hz720, canvas128, p64x6, nopretrain, from_random_init, fixed_hp, no_optuna, itrans_guid, unique_seg, ms35, eval_anchor]

experiment:
  dataset: electricity
  name: binary-c128-p64x6-apdf-elec7v-hz720-fixedhp
  experiment_name: binary_c128_p64x6_apdf_elec7v_hz720_fixedhp
  n_variates: 7
  occupancy_encoding: one_hot
  guidance_type: itransformer
  train_time_coverage: 1.0
  cache_cond_kv: true
  max_scale: 3.5
  max_scale_by_dataset:
    electricity: 3.5
  config_nickname: apdf-p64-elec7v-s42-hz720-ms35
  data_subset_by_dataset:
    electricity:
      subset_id: electricity_7v_rand_s42
      all_variates: false
      variate_indices: [9, 104, 119, 132, 173, 197, 250]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      electricity: 1182
    fixed_tuned_params:
      learning_rate: 1.626e-4
      ema_decay: 0.99
      max_scale: 3.5
      target_univariate_batch: 1182
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      electricity: 1793
    fixed_tuned_params:
      learning_rate: 7.818e-4
      ema_decay: 0.995
      max_scale: 3.5
      target_univariate_batch: 1793
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: apdf_p64_elec7v_s42_hz720_s1_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      electricity: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
