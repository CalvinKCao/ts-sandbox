# Ablation vs bce_dist: disable distance-weighted BCE (equal pixel penalty W=1).
# Anchor stays map BCE only (λ=1, no soft-decode 1D MSE). Reuses g=1 synth
# pretrain; reuses patch decoder from bce_dist. Fixed HPs from bce_dist Optuna
# winners; no Optuna retune.
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20_bce_dist.yaml

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - joint_g_lr_batch
    - reuse_g1_pretrain
    - fixed_hp_from_bce_dist
    - train_window_aug
    - anchor_mse_objective
    - anchor_bce_dist_no_soft_mse
    - flat_pixel_bce
    - repr_t1

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-joint-g-lr-batch-s30r20-bce-dist-flat-pixel-bce
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20_bce_dist_flat_pixel_bce
  anchor_mse_proxy_lambda: 1.0
  binary_use_boundary_weighted_bce: false

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_noise_sched_ablation_vertical_dual_g1p0

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20_bce_dist

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    # Clear joint parent Hyperband→refit (avoid 20ep train + 20ep refit).
    refit_best_max_epochs: null
    refit_best_patience: null
    search_space: fixed
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 0.5
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh1:
        learning_rate: 0.00036714090880850866
        target_univariate_batch: 512
        binary_length_g: 1.1684275177431984
      traffic:
        learning_rate: 0.0012606339523889608
        target_univariate_batch: 512
        binary_length_g: 9.690688297671034
      exchange_rate:
        learning_rate: 0.00013002903021971986
        target_univariate_batch: 1024
        binary_length_g: 1.2776228386407587

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
