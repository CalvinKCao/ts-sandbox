extends: configs/binary_anchor_ar_patch_decoder_ctx.yaml

training:
  diffusion_effective_batch_multiplier: 1.5
  finetune_hp_lr_min: 0.0002
  finetune_hp_lr_max: 0.0002

wandb:
  enabled: true
  project: ts-sandbox-leaderboard
  tags: [patch_decoder, healthy_norm, lb336_hz720, fixed_hp]

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-fixed
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_fixed
  guidance_type: patch_decoder
  mmpd_patch_size: 12
  lookback_length: 336
  forecast_length: 720
  lookback_overlap: 8
  diffusion_lookback_cap: 336
  diffusion_chunk_horizon: 0
  representation_time_stride: 2
  itrans_lookback_length: 336
  window_norm_low_var_threshold: 0.3
  window_norm_low_var_unit_std: 1.0
  window_norm_low_var_unit_std_by_dataset:
    ETTh1: 2.0
    electricity: 0.05
    exchange_rate: 0.2356
  lookback_overlap_center_shift: true
  max_scale_by_dataset:
    ETTh1: 5.2
    electricity: 5.4
    exchange_rate: 10.6

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
