experiment:
  name: binary-dual-scale
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  use_dual_scale: true
  dual_scale_fine_weight: 0.5
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  use_window_normalization: true
  data_subset:
    enabled: true
    target_dataset: weather
    reduce_if_larger_than_target: true
    max_variates: 32
    variate_strategy: first
    sample_stride: auto
    apply_stride_to_test: true
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  - phase: itrans_hp_pretrain
    n_trials: 10
    max_epochs: 10

  - phase: diffusion_hp_pretrain
    n_trials: 8
    max_epochs: 5
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true

  - phase: diffusion_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 15

  - phase: eval
    n_samples: 30
