extends: configs/binary_anchor_ar_patch_decoder_ctx.yaml

training:
  diffusion_effective_batch_multiplier: 1.5
  finetune_hp_effective_batch_min_frac: 0.25
  finetune_hp_effective_batch_max_frac: 4.0

wandb:
  enabled: true
  project: ts-sandbox-leaderboard
  tags: [patch_decoder, healthy_norm, reduced_hp]

experiment:
  name: binary-anchor-ar-patch-decoder-healthy-norm-reduced-hp
  experiment_name: binary_anchor_ar_patch_decoder_ctx_healthy_norm_reduced_hp
  guidance_type: patch_decoder
  mmpd_patch_size: 12
  window_norm_low_var_threshold: 0.3
  window_norm_low_var_unit_std: 1.0
  window_norm_low_var_unit_std_by_variate:
    dynamic: [1.0, 0.2, 0.26, 0.26, 0.26, 0.5, 1.0]
  lookback_overlap_center_shift: true
  max_scale_by_dataset:
    dynamic: 4.24
    electricity: 2.92

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    reuse_pretrain_from_config: binary_anchor_ar_patch_decoder_ctx

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx

  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: reduced_hp
    hp_lr_min: 1.0e-4
    hp_lr_max: 5.0e-4
    min_micro_batch: 4
    min_snr_gamma: 2.0

  - phase: diffusion_fine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: reduced_hp
    hp_lr_min: 1.0e-5
    hp_lr_max: 1.0e-3
    min_micro_batch: 4
    min_snr_gamma: 2.0

  - phase: staged_eval
    eval_test_fraction: 1.0
    eval_test_fraction_by_dataset:
      dynamic: 0.2
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
