extends: configs/binary_anchor_ar.yaml

experiment:
  name: binary-anchor-ar-patch-decoder-ctx
  experiment_name: binary_anchor_ar_patch_decoder_ctx
  guidance_type: patch_decoder
  mmpd_patch_size: 12

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: patch_guidance_finetune_hp
    n_trials: 10
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
