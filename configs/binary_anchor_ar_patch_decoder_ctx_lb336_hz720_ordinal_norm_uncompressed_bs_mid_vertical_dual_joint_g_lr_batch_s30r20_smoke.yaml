# Local smoke for joint g+LR+batch (anchor-MSE Optuna). Uses --smoke-test.
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20.yaml

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-joint-g-lr-batch-s30r20-smoke
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20_smoke
  dataset: ETTh1
  n_variates: 7

training:
  train_window_aug:
    enabled: true
    apply_prob: 1.0
    acf_threshold: 0.35

wandb:
  enabled: false
  tags: [vertical_dual, smoke, joint_g_lr_batch, train_window_aug]

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null
    n_samples: 1
    epochs: 1
    patience: 1

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    refit_best_max_epochs: 1
    refit_best_patience: 1
    search_space: lr_eff_batch_g
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 1.0
    hp_g_min: 1.0
    hp_g_max: 3.0
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [512]
    ema_decay: 0.995
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    binary_length_mode: power
    binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 0.05
    test_stride: 32
    n_samples: 1
    probabilistic_n_samples: 1
    probabilistic_num_inference_steps: 3
    tune_sampler: false
    skip_eval_visualizations: true
