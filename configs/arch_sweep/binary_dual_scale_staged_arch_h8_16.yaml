# Auto-thinned: extends binary_dual_scale_staged.yaml
extends: ../binary_dual_scale_staged.yaml
experiment:
  name: binary-dual-scale-staged-arch-h8-16
  experiment_name: binary-dual-scale-staged-arch-h8-16
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  coarse_image_height: 8
  fine_image_height: 16
  max_scale: 3.5
  window_norm_std_floor: 0.1
  dit_patch_size:
  - 8
  - 8
  dit_embed_dim: 384
  dit_depth: 8
  dit_num_heads: 6
  dit_mlp_ratio: 4.0
  dit_dropout: 0.0
  use_dual_scale: false
  diffusion_stage: joint
  use_guidance_channel: false
  cfg_dropout: 0.0
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  max_scale_by_dataset:
    ETTh1: 3.5
    ETTh2: 3.5
    exchange_rate: 8.0
    weather: 7.9
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    max_variates_by_dataset:
      ETTm1: 4
      weather: 4
      solar_Alabama: 2
    variate_strategy: first
    subset_id_template: '{dataset}_{n_variates}v_s{sample_stride}'
phases:
- phase: staged_diffusion_pretrain
  phase1_config_name: binary_dual_scale
- phase: itrans_finetune_hp
  n_trials: 10
  max_epochs: 10
  cold_start: true
- phase: diffusion_coarse_finetune_hp
  search_space: lr_only
  n_trials: 20
  max_epochs: 20
  patience: 8
- phase: diffusion_fine_finetune_hp
  search_space: lr_only
  n_trials: 20
  max_epochs: 20
  patience: 8
- phase: staged_eval
  eval_test_fraction: 1.0
  n_samples: 1
  test_stride: 4
  probabilistic_n_samples: 20
  tune_sampler: false
  probabilistic_sampler: dpmpp
  probabilistic_num_inference_steps: 20
  skip_eval_visualizations: true
