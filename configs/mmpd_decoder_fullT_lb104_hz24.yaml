# Paper-fixed Decoder MMPD, uncapped 100% train (no MMPD_MAX_TRAIN_WINDOWS).
# HPs: MMPD paper §8 Implementation table + official Decoder defaults. tune_trials: 0.

experiment:
  name: mmpd-decoder-fullT-lb104-hz24
  experiment_name: mmpd_decoder_fullT_lb104_hz24

mmpd:
  backbone: Decoder
  subset_config: compare_baselines_allv_fullT.yaml
  lookback: 104
  horizon: 24
  datasets:
    - illness
  patch_size_default: 12
  patch_size_wide: 24
  train_epochs: 20
  patience: 5
  learning_rate: 1.0e-4
  point_weight: 0.01
  dropout: 0.2
  ema_decay: 0
  batch_size: 32
  sample_num: 20
  num_sampling_steps: 20
  gmm_components: 10
  gmm_iterations: 10
  prior_pi_decay: 0.5
  prior_precision_shape: 100
  lradj: fixed
  tune_trials: 0
  skip_sample_viz: true
  eval_subsets: binary_10pct,test_100pct
  leaderboard: true
  leaderboard_nickname: "MMPD fullT ILI L104 H24"
