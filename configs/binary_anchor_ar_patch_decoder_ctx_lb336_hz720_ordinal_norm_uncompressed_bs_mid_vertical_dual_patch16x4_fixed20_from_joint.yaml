# Fixed HP from joint_g_lr_batch_s30r20 Optuna winners (jobs 4263255–61).
# DiT patch (H,W)=(16,4) instead of (8,8). Architecture change ⇒ train fresh
# vertical_dual synth pretrain (cannot weight-reuse 8x8 g1p0). Reuse patch
# guidance from the joint campaign; no Optuna retune; 20ep finetune + early stop.
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual.yaml

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - patch16x4
    - fixed_hp_from_joint_s30r20
    - reuse_joint_decoder
    - train_window_aug
    - repr_t1

training:
  train_window_aug:
    enabled: true
    apply_prob: 0.5
    acf_threshold: 0.35

experiment:
  name: binary-vd-lb336-hz720-ord-unc-p16x4-fixed20-from-joint
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_patch16x4_fixed20_from_joint
  dit_patch_size: [16, 4]
  # Phase-1 synth pretrain stays at identity schedule (g=1). Per-dataset
  # winner g lives only under fixed_tuned_params_by_dataset for finetune.
  binary_length_mode: power
  binary_length_scale: 1.0
  binary_length_g: 1.0
  binary_length_g_by_dataset: {}
  data_subset:
    max_variates_by_dataset:
      dynamic: 2
    sample_stride_by_dataset:
      dynamic: 480

phases:
  - phase: staged_diffusion_pretrain
    # Fresh 16x4 pretrain — 8x8 g1p0 weights are shape-incompatible.
    reuse_pretrain_from_config: null

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 0.5
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh2:
        learning_rate: 0.0005988811135760835
        target_univariate_batch: 1024
        binary_length_g: 1.1711402938445636
      ETTm1:
        learning_rate: 0.00017383245752963103
        target_univariate_batch: 512
        binary_length_g: 5.104629857953324
      ETTm2:
        learning_rate: 0.00013298520045574457
        target_univariate_batch: 512
        binary_length_g: 7.8552492159173735
      weather:
        learning_rate: 7.62863069748409e-05
        target_univariate_batch: 2048
        binary_length_g: 2.098695399750654
      PeMS:
        learning_rate: 0.00010458207324696746
        target_univariate_batch: 512
        binary_length_g: 3.8021138287008247
      solar_Alabama:
        # Joint Optuna winner (refit was still finishing when HPs were snapshotted).
        learning_rate: 0.00018878091236458985
        target_univariate_batch: 512
        binary_length_g: 7.483532317986583
      dynamic:
        learning_rate: 0.0014043399738332717
        target_univariate_batch: 512
        binary_length_g: 6.370356224366058

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
