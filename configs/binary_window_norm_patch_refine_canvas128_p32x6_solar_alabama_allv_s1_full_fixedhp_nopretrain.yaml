# Full solar Alabama all-137-var, stride 1, uncapped train/val windows.
# Nopre + fixed HPs from with-pre cap1x2x Optuna job 5040195 (p32 H=96):
#   coarse#7  lr=3.437e-4 ema=0.995 U=434
#   fine#4    lr=8.595e-5 ema=0.99  U=217
#   guidance  lr=5e-4 (inherited itrans_paper_lr_grid single choice)
# No staged_diffusion_pretrain; coarse+fine from_random_init.
# Eval: 10% of stride-1 test windows (eval_test_fraction=0.1).
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_randwin_lr10_cap1x2x.yaml
replace_phases: true

wandb:
  tags: [solar_Alabama, all_variates, stride1, full_train, fixed_hp, withpre_best, no_optuna, nopretrain, from_random_init, canvas128, p32x6, win_frac_1, patch_frac_1, anchor_every4, eval_s1_n10_steps4, eval_frac_0p1, hz96, job5040195_hps]

experiment:
  dataset: solar_Alabama
  name: binary-window-norm-patch-refine-c128-solar-alabama-allv-s1-full-fixedhp-nopretrain
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_solar_alabama_allv_s1_full_fixedhp_nopretrain
  config_nickname: c128-solar-allv-s1-full-fixedhp-nopre-5040195
  patch_refine_patch_height: 32
  data_subset_by_dataset:
    solar_Alabama:
      subset_id: solar_Alabama_allv_s1
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.00034370191906144844
      ema_decay: 0.995
      target_univariate_batch: 434
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 8.594881594258425e-05
      ema_decay: 0.99
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.1
    test_stride: 1
    eval_progress_key: canvas128_solar_alabama_allv_s1_full_fixedhp_nopre_s1_n10_steps4_eval10pct
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size_by_dataset:
      solar_Alabama: 5
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
