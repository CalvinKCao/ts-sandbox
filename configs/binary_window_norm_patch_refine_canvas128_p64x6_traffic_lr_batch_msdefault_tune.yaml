# Traffic: default max_scale=6.0; one fixed-HP control plus five LR/batch trials.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_traffic.yaml

wandb:
  tags: [optuna, lr_batch_tune, default_max_scale, traffic, canvas128, p64x6]

experiment:
  name: binary-window-norm-patch-refine-c128-traffic-lr-batch-msdefault
  experiment_name: binary_window_norm_patch_refine_c128_traffic_lr_batch_msdefault

phases:
  - phase: diffusion_coarse_finetune_hp
    n_trials: 6
    search_space: lr_eff_batch_univariate
    # Current: lr=1.626e-4 and effective window batch 84 (U=336 for 4 vars).
    hp_lr_min: 0.000016260630766856958
    hp_lr_max: 0.0016260630766856958
    effective_univariate_batch_grid: [168, 336, 504]
    ema_decay: 0.99
    binary_noise_schedule: linear
    loss_weighting: none
    min_snr_gamma: 5.0
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0
    # Control: current fixed HPs, but policy default max_scale=6.0.
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        effective_univariate_batch: 336

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 6
    search_space: lr_eff_batch_univariate
    # Current: lr=7.818e-4 and effective window batch 64 (U=256 for 4 vars).
    hp_lr_min: 0.00007817554354066733
    hp_lr_max: 0.007817554354066733
    effective_univariate_batch_grid: [128, 256, 384]
    ema_decay: 0.995
    binary_noise_schedule: linear
    loss_weighting: none
    min_snr_gamma: 2.0
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0
    # Control: current fixed HPs, but policy default max_scale=6.0.
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        effective_univariate_batch: 256
