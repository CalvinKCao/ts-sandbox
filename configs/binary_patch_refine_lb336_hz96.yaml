# Boundary-centered patch refinement fine stage (lb336 / hz96).
# Synth + coarse unchanged; fine residual replaced by patch_refine.
extends: configs/base/binary_staged.yaml

training:
  force_retrain_synthetic: true
  use_hardcoded_synthetic_hp: true
  n_finetune_hp_trials: 1
  finetune_hp_lr_min: 0.0002
  finetune_hp_lr_max: 0.0002
  diffusion_batch_size: 2
  finetune_batch_sizes: [1, 2]
  diffusion_ema_decay: 0.0

wandb:
  enabled: false
  project: ts-sandbox-leaderboard
  tags: [patch_refine, lb336_hz96, smoke]

geometry:
  lookback_length: 336
  forecast_length: 96
  lookback_overlap: 8
  diffusion_lookback_cap: 336
  diffusion_chunk_horizon: 0
  representation_time_stride: 1
  past_cond_resize_to_horizon: false
  itrans_lookback_length: 336

experiment:
  name: binary-patch-refine-lb336-hz96
  experiment_name: binary_patch_refine_lb336_hz96
  dataset: ETTh1
  n_variates: 1
  seed: 42
  diffusion_type: binary
  model_type: dit
  image_height: 16
  coarse_image_height: 16
  fine_image_height: 16
  use_patch_refine_stage: true
  patch_refine_canvas_height: 256
  patch_refine_patch_height: 32
  patch_refine_patch_width: 8
  patch_refine_col_stride: 6
  dit_patch_size: [4, 4]
  dit_cond_patch_size: [8, 8]
  # Smoke-sized DiT; bump to 384/8/6 for real runs.
  dit_embed_dim: 64
  dit_depth: 2
  dit_num_heads: 2
  use_guidance_channel: false
  disable_cross_attention: true
  cfg_dropout: 0.0
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  binary_anchor_input_mode: stationary_flat
  prediction_target: x0
  loss_weighting: min_snr
  min_snr_gamma: 2.0
  binary_noise_schedule: linear
  use_window_normalization: true
  use_ordinal_window_norm: false
  eval_sampler: anchor
  data_subset:
    ETTh1:
      n_variates: 1
      train_stride: 64
      test_stride: 64

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 1
    epochs: 1
    patience: 1
    shared_cache: false

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0002
      batch_size: 1
      gradient_accumulation_steps: 1
      ema_decay: 0.0
      binary_noise_schedule: linear
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      prediction_target: x0

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0002
      batch_size: 1
      gradient_accumulation_steps: 1
      ema_decay: 0.0
      binary_noise_schedule: linear
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      prediction_target: x0

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 2
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 5
    batch_size: 1
    gmm_components: 5
    topk_max: 3
    skip_eval_visualizations: true
