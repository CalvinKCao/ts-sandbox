# Smoke test config: fast run to verify pipeline mechanics
experiment:
  name: binary-anchor-smoke
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  smoke_test: true

phases:
  - phase: itrans_hp_pretrain
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_hp_pretrain
    n_trials: 1
    max_epochs: 1

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 1
    cold_start: true

  - phase: diffusion_finetune_hp
    n_trials: 1
    max_epochs: 1

  - phase: eval
    n_samples: 1
