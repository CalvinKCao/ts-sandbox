# No-pretrain ablation of H96 cap1x2x (p64). Same crop caps / eval budgets;
# omit staged_diffusion_pretrain and start coarse + patch_refine from random
# init (from_random_init). Patch-guidance FT is already cold-start on real data
# (create_patch_guidance_stack) — no synth donor warm-start when pretrain is
# skipped. Distinct experiment_name / tags / eval_progress_key vs pretrained.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x.yaml
replace_phases: true

wandb:
  tags: [all_variates, randwin, lr10, canvas128, p64x6, win_frac_1, patch_frac_1, lr_batch_ema, anchor_every4, eval_s1_n10_steps4, median_pruner, patience_5, nopretrain, from_random_init, hz96, caps_crops_1x2x_etth1]

experiment:
  name: binary-window-norm-patch-refine-c128-allv-randwin-lr10-cap1x2x-nopretrain
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x_nopretrain

phases:
  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
      ETTh2: 217
      ETTm1: 217
      ETTm2: 217
      exchange_rate: 217
      weather: 217
      electricity: 217
      solar_Alabama: 217
      PeMS: 217
      traffic: 217
      illness: 217
      dynamic: 217
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.99
    ema_decay_grid: [0.98, 0.99, 0.995]
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.99
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
      ETTh2: 217
      ETTm1: 217
      ETTm2: 217
      exchange_rate: 217
      weather: 217
      electricity: 217
      solar_Alabama: 217
      PeMS: 217
      traffic: 217
      illness: 217
      dynamic: 217
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.99, 0.995, 0.999]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_allv_randwin_lr10_cap1x2x_nopretrain_s1_n10_steps4
    eval_max_windows_by_dataset:
      ETTh1: 1838
      ETTh2: 1838
      ETTm1: 1959
      ETTm2: 1942
      electricity: 42
      traffic: 10
      exchange_rate: 939
      weather: 1313
      solar_Alabama: 100
      PeMS: 50
      dynamic: 1622
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size_by_dataset:
      ETTh1: 5
      ETTh2: 5
      ETTm1: 5
      ETTm2: 5
      exchange_rate: 5
      weather: 5
      solar_Alabama: 5
      electricity: 1
      PeMS: 1
      traffic: 1
      illness: 5
      dynamic: 5
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
