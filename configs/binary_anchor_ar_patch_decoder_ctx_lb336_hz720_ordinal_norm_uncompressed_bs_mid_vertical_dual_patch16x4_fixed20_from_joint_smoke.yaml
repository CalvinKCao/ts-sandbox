# Local smoke for patch16x4 fixed20 (fresh tiny pretrain; no donor ckpt needed).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_patch16x4_fixed20_from_joint.yaml

experiment:
  name: binary-vd-lb336-hz720-ord-unc-p16x4-fixed20-from-joint-smoke
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_patch16x4_fixed20_from_joint_smoke
  dataset: ETTh2
  n_variates: 7

training:
  train_window_aug:
    enabled: true
    apply_prob: 1.0
    acf_threshold: 0.35

wandb:
  enabled: false
  tags: [vertical_dual, smoke, patch16x4]

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null
    n_samples: 1
    epochs: 1
    patience: 1

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: fixed
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 1.0
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh2:
        learning_rate: 0.0005988811135760835
        target_univariate_batch: 1024
        binary_length_g: 1.1711402938445636

  - phase: staged_eval
    eval_test_fraction: 0.05
    test_stride: 32
    n_samples: 1
    probabilistic_n_samples: 1
    probabilistic_num_inference_steps: 3
    tune_sampler: false
    skip_eval_visualizations: true
