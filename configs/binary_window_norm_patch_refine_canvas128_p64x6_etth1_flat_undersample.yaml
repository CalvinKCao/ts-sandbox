# ETTh1 canvas128 refine-only retrain with GT-flatline *crop* undersampling.
#
# Reuses synth pretrain + coarse (+ guidance) from pre-bitflip canvas128 ETTh1
# donor job 4571065 (config stem binary_window_norm_patch_refine_canvas128_p64x6).
# Does NOT reuse bitflip-cond ckpts (4672672); no logit/bitflip conditioning.
#
# Flatline undersample (patch_refine train only; per refine crop × active var):
#   - Unique-seg crops are patch_width=6 coarse columns (canvas128 p64x6)
#   - Coarse H=16 window-norm bins; flat run = ≥3 identical bins AND
#     continuous GT range ≤ 0.25 × bin_width, restricted to that 6-wide crop
#   - Keep 100% of wiggle crops; randomly keep 20% of flatline crops
#   - Do NOT drop an entire H=96 parent because one segment is flat
#   - Seed: patch_refine_flatline_seed=133 (= pipeline seed 42 + offset 91)
#
# Donor paths (Killarney; verify before submit):
#   reused pretrain:
#     $SCRATCH/ts-sandbox/reused/pretrain/binary_window_norm_patch_refine_canvas128_p64x6/
#       pretrained_{coarse,patch_refine}/pretrained_diffusion.pt
#   run tree (shared results via worktree symlink):
#     results/ckpts/08-03-4571065-ETTh1-binary_window_norm_patch_refine_canvas128_p64x6/
#       ETTh1[_7v_s1]/{coarse,patch_refine}/best.pt
#       ETTh1[_7v_s1]_patch_guidance.pt
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6.yaml

wandb:
  tags:
    - ablation
    - window_norm
    - patch_refine
    - canvas128
    - p64x6
    - early_july_norm
    - ETTh1
    - flat_undersample_0p2
    - refine_crop_filter
    - refine_only
    - donor_4571065

experiment:
  name: binary-window-norm-patch-refine-canvas128-p64x6-etth1-flat-undersample
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_etth1_flat_undersample
  config_nickname: c128-etth1-flat-undersample-0p2
  patch_refine_flatline_keep_frac: 0.2
  patch_refine_flatline_seed: 133
  patch_refine_flatline_min_run: 3
  patch_refine_flatline_eps_frac: 0.25

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10
    reuse_checkpoint_from_config: binary_window_norm_patch_refine_canvas128_p64x6

  - phase: diffusion_coarse_finetune_hp
    # Copy coarse best.pt + HPs from 4571065 donor (no retrain).
    reuse_tuned_params_from: binary_window_norm_patch_refine_canvas128_p64x6

  - phase: diffusion_patch_refine_finetune_hp
    # Retrain refine with donor HPs; per-crop flatline undersample in phase.
    reuse_tuned_params_from: binary_window_norm_patch_refine_canvas128_p64x6
    retrain: true
