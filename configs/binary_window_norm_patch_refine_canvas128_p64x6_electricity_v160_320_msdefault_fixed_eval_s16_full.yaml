# Evaluation-only rerun of job 4730294; weights remain in the original checkpoint root.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_electricity_v160_320_msdefault_fixed.yaml
replace_phases: true

wandb:
  tags: [evaluation_only, full_test, stride16, anchor_only, electricity, channels_160_320]

experiment:
  # Read weights from job 4730294; this eval writes to a new job-specific root.
  eval_source_checkpoint_dir: results/ckpts/08-12-4730294-electricity-binary_window_norm_patch_refine_canvas128_p64x6_electricity_v160_320_msdefault_fixed
  data_subset_by_dataset:
    electricity:
      test_stride: 16

visualization:
  # No MMPD pack matches this full-variates model; avoid invalid point-gap output.
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

phases:
  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 16
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    probabilistic_num_inference_steps: 1
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
