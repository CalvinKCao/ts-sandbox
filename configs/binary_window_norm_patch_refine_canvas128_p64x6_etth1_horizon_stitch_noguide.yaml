# Horizon-stitch finetune on frozen ETTh1 canvas128 coarse (job 4571065).
# No guidance channel (disable_cross_attention). Same s1 / 66% / n=10 / 4-step
# eval protocol as the no-prev jobs, with dataset horizon 284.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_etth1_no_prev_cond.yaml
replace_phases: true

geometry:
  forecast_length: 284
  horizon_stitch: overlap_avg
  horizon_chunk_inner: 96

wandb:
  tags: [ablation, window_norm, patch_refine, canvas128, p64x6, horizon_stitch, no_guidance, no_prev_cond, ETTh1]

experiment:
  name: binary-window-norm-patch-refine-c128-etth1-horizon-stitch-noguide
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_etth1_horizon_stitch_noguide
  seed: 42
  disable_cross_attention: true
  patch_refine_use_prev_cond: false
  patch_refine_prev_cond_dropout: 0

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    reuse_checkpoint_dir: /scratch/ccao87/ts-sandbox/results/ckpts/08-03-4571065-ETTh1-binary_window_norm_patch_refine_canvas128_p64x6
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    retrain: true
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      batch_size: 36
      gradient_accumulation_steps: 1
      ema_decay: 0.995
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 2.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2
      target_univariate_batch: 256

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.66
    test_stride: 1
    eval_progress_key: canvas128_s1_n10_f66_stitch284_noguide_noprev_steps4
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
