# Ablation: keep ordinal ladder + guided [8,8]/epsilon/none, but restore residual
# fine → finer (not unique-seg patch_refine). Fixed HPs from early-July 4037033.
# Finer was listed but skipped in that run (use_triple_scale=False); here we
# enable the full residual cascade with the same fine-stage HPs for finer.
extends: configs/binary_patch_refine_lb336_hz96_ordinal_tuned_guided_p8.yaml
replace_phases: true

training:
  n_finetune_hp_trials: 1
  finetune_max_micro_batch: 2048
  # Pin guidance LR to early-July Optuna winner (categorical grid).
  itrans_paper_lr_grid: [0.0005]

wandb:
  tags: [ablation, ordinal_norm, fine_finer, fixed_hp, early_july_hps, guided_p8]

experiment:
  name: binary-ordinal-fine-finer-earlyjuly-hps
  experiment_name: binary_ordinal_fine_finer_earlyjuly_hps
  use_window_normalization: false
  use_ordinal_window_norm: true
  ordinal_ood_shift_causal_only: true
  # Residual dual/triple path instead of patch_refine.
  use_patch_refine_stage: false
  use_triple_scale: true
  finer_image_height: 16
  patch_refine_unique_segments: false
  dit_patch_size: [8, 8]
  use_guidance_channel: true
  disable_cross_attention: false
  prediction_target: epsilon
  loss_weighting: none

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    # Signature differs from patch_refine bridge cache; allow train-or-reuse.
    require_reuse_pretrain: false

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    # Early-July 4037033 coarse Optuna winner (wandb iletzehu).
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    # Early-July 4037033 fine Optuna winner (wandb gsav015x) — same as coarse.
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_finer_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    # No finer winner in 4037033 (skipped); reuse early-July fine HPs.
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 16
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
