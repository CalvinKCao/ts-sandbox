# Short CRPS g-ablation base for past-native stride-2 compression (g=1.0 / identity).
# Reuses synthetic pretrain + patch guidance; retrains coarse+fine only (4 epochs).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_past_native.yaml

wandb:
  tags: [noise_sched_ablation, past_native, g1p0, baseline]

experiment:
  name: binary-noise-sched-ablation-past-native-g1p0
  experiment_name: binary_noise_sched_ablation_past_native_g1p0
  binary_length_mode: none
  binary_length_g: 1.0
  binary_length_scale: 1.0

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_fixed

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 4
    patience: 4
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 4
    patience: 4
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
