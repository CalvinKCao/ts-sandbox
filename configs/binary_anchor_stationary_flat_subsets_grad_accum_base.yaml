extends: binary_anchor_stationary_flat_subsets_ema099.yaml

# Reuse ema099 synthetic pretrain + iTrans; Optuna-tune diffusion LR per stage (lr_only).
# Leaf configs set finetune_hp_lr_{min,max} band + diffusion_effective_batch_multiplier.
phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_stationary_flat_subsets_ema099
  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_stationary_flat_subsets_ema099
  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_finer_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only
