# MMPD Decoder — ordinal window norm (no instance/window norm), lb336/hz720.
#
# Datasets: ETTh1, traffic, weather, dynamic, exchange_rate, electricity (ordinal norm sweep).
#
# Smoke:
#   ./submit_mmpd.sh --mmpd-run-config mmpd_decoder_flat_subsets_paper_lb336_hz720_ordinal_norm \
#     --smoke-test --datasets ETTh1 --mmpd-tune-trials 0 --no-mmpd-instance-norm
# Full:
#   ./submit_mmpd.sh --mmpd-run-config mmpd_decoder_flat_subsets_paper_lb336_hz720_ordinal_norm \
#     --output-dir results/datasets/$(date +%m-%d)-mmpd-decoder-ordinal-norm-lb336-hz720 \
#     --time 24:00:00 --mmpd-tune-trials 0 --no-mmpd-instance-norm

experiment:
  use_ordinal_window_norm: true
  use_window_normalization: false
  experiment_name: mmpd_decoder_flat_subsets_paper_lb336_hz720_ordinal_norm
  ordinal_tie_atol: 1.0e-6
  max_scale_by_dataset:
    ETTh1: 5.2
    traffic: 5.4
    weather: 5.4
    dynamic: 5.4
    exchange_rate: 10.6

mmpd:
  backbone: Decoder
  subset_config: binary_anchor_ar.yaml
  lookback: 336
  horizon: 720
  use_ordinal_window_norm: true
  datasets:
    - ETTh1
    - traffic
    - weather
    - dynamic
    - exchange_rate
    - electricity
  patch_size_default: 12
  patch_size_wide: 24
  train_epochs: 20
  patience: 5
  learning_rate: 1.0e-4
  point_weight: 0.01
  dropout: 0.2
  ema_decay: 0
  batch_size: 32
  sample_num: 20
  num_sampling_steps: 20
  gmm_components: 10
  gmm_iterations: 10
  prior_pi_decay: 0.5
  prior_precision_shape: 100
  lradj: fixed
  tune_trials: 0
  leaderboard: true
