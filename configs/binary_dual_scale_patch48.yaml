# Binary dual-scale with 4×4 DiT patches (dit_patch_size = [H, W]).
# Train-only (no pipeline eval). Metrics: ./submit_patch48_sampler_study.sh --eval-only
# (same path as submit_cfg_ablation.sh → eval_mmpd_gaussian_anchor.py).

experiment:
  name: binary-dual-scale-patch48
  experiment_name: binary-dual-scale-patch48
  dataset: ETTm1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  dit_patch_size: [4, 4]
  use_dual_scale: true
  dual_scale_fine_weight: 0.75
  dual_scale_independent_timesteps: true
  use_variate_embedding: true
  variate_factorized: true
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  - phase: itrans_hp_pretrain
    n_trials: 10
    max_epochs: 10

  - phase: diffusion_hp_pretrain
    n_trials: 8
    max_epochs: 5
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true

  - phase: diffusion_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 15
