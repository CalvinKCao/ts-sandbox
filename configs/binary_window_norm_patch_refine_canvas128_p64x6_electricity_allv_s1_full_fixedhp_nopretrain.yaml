# Full electricity all-321-var, stride 1, uncapped train/val windows.
# Nopre + fixed HPs from with-pre cap1x2x Optuna job 5057762 (p64 H=96):
#   coarse#0  lr=1.626e-4 ema=0.99 U=217
#   fine#1    lr=1.231e-3 ema=0.99 U=434
#   guidance  lr=5e-4 (inherited itrans_paper_lr_grid single choice)
# No staged_diffusion_pretrain; coarse+fine from_random_init.
# Eval: 10% of stride-1 test windows (eval_test_fraction=0.1).
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x.yaml
replace_phases: true

wandb:
  tags: [electricity, all_variates, stride1, full_train, fixed_hp, withpre_best, no_optuna, nopretrain, from_random_init, canvas128, p64x6, win_frac_1, patch_frac_1, anchor_every4, eval_s1_n10_steps4, eval_frac_0p1, hz96, job5057762_hps]

experiment:
  dataset: electricity
  name: binary-window-norm-patch-refine-c128-electricity-allv-s1-full-fixedhp-nopretrain
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_electricity_allv_s1_full_fixedhp_nopretrain
  config_nickname: c128-elec-allv-s1-full-fixedhp-nopre-5057762
  data_subset_by_dataset:
    electricity:
      subset_id: electricity_allv_s1
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      ema_decay: 0.99
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0012313680415535365
      ema_decay: 0.99
      target_univariate_batch: 434
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.1
    test_stride: 1
    eval_progress_key: canvas128_electricity_allv_s1_full_fixedhp_nopre_s1_n10_steps4_eval10pct
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size_by_dataset:
      electricity: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
