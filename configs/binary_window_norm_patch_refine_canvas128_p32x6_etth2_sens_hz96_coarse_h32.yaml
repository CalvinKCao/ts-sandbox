# ETTh2 H=96 sensitivity: coarse_image_height 32 (vs 16). Canvas stays 128.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_etth2_sens_hz96_base.yaml

wandb:
  tags: [ETTh2, etth2_sens, all_variates, canvas128, p32x6, nopretrain, from_random_init, hz96, dedicated_h, nostitch, itrans_guid, fixed_hp, no_optuna, train_time_coverage_1, r0, ms35, cache_cond_kv, eval_anchor_only, n_samp_1, compile, u1186_1886, l40s, sens_coarse, h32]

experiment:
  name: binary-c128-p32x6-etth2-sens-hz96-coarse-h32
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_etth2_sens_hz96_coarse_h32
  # Base state stays at image_height 16 unless this is set. Coarse training
  # restages to coarse_image_height, but the post-finetune rebuild used the
  # base height and died with "expects image_height=32, got 16".
  image_height: 32
  coarse_image_height: 32
  config_nickname: c128-p32-etth2-sens-hz96-coarse-h32

phases:
  # Patch-refine U=1886 then U=1536 both died on the first compiled backward.
  # Null drops the inherited ETTh2 cap so the job probes max fit from scratch
  # and trains at 0.8 of that U (accum 1). Coarse stays at 1186.
  - phase: diffusion_patch_refine_finetune_hp
    probe_univariate_micro_batch_once: true
    probe_train_batch_size_headroom: 0.8
    max_univariate_micro_batch_by_dataset:
      ETTh2: null
    fixed_tuned_params_by_dataset:
      ETTh2:
        target_univariate_batch: null
  - phase: staged_eval
    eval_progress_key: etth2_sens_hz96_coarse_h32_reprobe_s1_anchor
