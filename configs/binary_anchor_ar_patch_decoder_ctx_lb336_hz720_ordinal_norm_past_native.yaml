# Compressed 336/720 ordinal_norm variant: keep representation_time_stride=2, but encode
# lookback 2D conditioning at the *same* native resolution as the horizon
# (2 timesteps → 1 column) instead of bilinearly resizing past cond to horizon width.
#
# Parent ordinal_norm inherits past_cond_resize_to_horizon=true from base; this flips it off.
# Spatial DiT width stays horizon-sized (past is padded, not stretched, when concatenated).
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm.yaml

wandb:
  tags: [patch_decoder, ordinal_norm, lb336_hz720, fixed_hp, past_native, stride2]

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ordinal-norm-past-native
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_past_native
  # representation_time_stride: 2  (inherited from fixed via ordinal_norm)
  past_cond_resize_to_horizon: false

phases:
  - phase: staged_diffusion_pretrain
    # Same stride=2 geometry as ordinal_norm/fixed; past-cond semantics differ at finetune.
    reuse_pretrain_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm
