# PeMS 7 PAM variates: same 10+10 HP search as traffic
# ...traffic_7v_rep...hpsearch_u1186_1886_sel_amse (job 5503757).
# Epoch val / early-stop / best.pt stay occupancy BCE. Optuna trial ranking
# uses n=1 unique-seg (fine) / window (coarse) val anchor MSE.
# Search: lr / U×{1,2,4} / EMA 0.995, coarse max_scale [3, 7], fine
# patch_h {16,32,48,64}. U copied from traffic 7v L40S (1186/1886), not
# allv PeMS 5519/5503. Native L=96 H=96. Indices from
# reports/pems-7v-representative/ (train-split PAM k-medoids, seed 42).
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_fullT_hz720_nostitch_nopretrain_fixedhp_r0_ms35_kv.yaml
replace_phases: true

geometry:
  lookback_length: 96
  forecast_length: 96
  lookback_overlap: 8
  diffusion_lookback_cap: 96
  past_cond_resize_to_horizon: false
  itrans_lookback_length: 96

wandb:
  tags: [PeMS, pems_7v_rep, canvas128, p32x6, nopretrain, from_random_init, lb96, hz96, nostitch, itrans_guid, hpsearch, lr_batch_ema, ema995, max_scale_3_7, patch_h_16_32_48_64, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile, u1186_1886, sel_amse]

experiment:
  name: binary-c128-p32x6-pems-7v-rep-lb96-hz96-hpsearch-u1186-1886-sel-amse
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_pems_7v_rep_lb96_hz96_nostitch_nopretrain_hpsearch_u1186_1886_sel_amse
  n_variates: 7
  patch_refine_patch_height: 32
  patch_refine_unique_segments: true
  config_nickname: c128-p32-pems-7v-rep-lb96-hz96-hpsearch-ema995-u1186-1886-sel-amse
  data_subset_by_dataset:
    PeMS:
      subset_id: pems_7v_rep_s1_sel_amse
      all_variates: false
      variate_indices: [24, 27, 90, 144, 207, 240, 244]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: staged_anchor_mse
    max_univariate_micro_batch_by_dataset:
      PeMS: 1186
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.995]
    hp_max_scale_min: 3.0
    hp_max_scale_max: 7.0
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.995
        max_scale: 3.5
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: staged_anchor_mse
    max_univariate_micro_batch_by_dataset:
      PeMS: 1886
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.995]
    hp_patch_refine_height_grid: [16, 32, 48, 64]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
        patch_refine_patch_height: 32
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_p32x6_pems_7v_rep_lb96_hz96_hpsearch_u1186_1886_sel_amse_s1_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      PeMS: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
