extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_per_ds_best_g_aug_fixed20.yaml

# Local smoke: 1 sample / 1 epoch paths via --smoke-test.
experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-aug-fixed-smoke
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_per_ds_best_g_aug_fixed20_smoke
  dataset: ETTh1
  n_variates: 7

training:
  skip_synthetic_tuning: true
  force_retrain_synthetic: true
  train_window_aug:
    enabled: true
    apply_prob: 1.0
    acf_threshold: 0.35

wandb:
  enabled: false
  tags: [vertical_dual, smoke, train_window_aug]

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null
    n_samples: 1
    epochs: 1
    patience: 1

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 1.74e-4
      target_univariate_batch: 512
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
    fixed_tuned_params_by_dataset: {}

  - phase: staged_eval
    n_samples: 1
    probabilistic_n_samples: 1
    probabilistic_num_inference_steps: 3
    tune_sampler: false
    skip_eval_visualizations: true
