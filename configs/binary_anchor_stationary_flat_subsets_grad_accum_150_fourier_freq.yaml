extends: binary_anchor_stationary_flat_subsets_ema099.yaml

training:
  diffusion_effective_batch_multiplier: 1.5
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002

visualization:
  dual_scale_sampler: dpmpp
  dual_scale_inference_steps: 20

experiment:
  name: binary-anchor-stationary-flat-subsets-grad-accum-150-fourier-freq
  experiment_name: binary_anchor_stationary_flat_subsets_grad_accum_150_fourier_freq
  staged_representation: fourier_frequency
  use_guidance_channel: false
  disable_cross_attention: false
  fourier_high_freq_percent: 0.85
  fourier_high_freq_cutoff_bin: 0
  fourier_fine_max_scale: 0.0
  fourier_fine_scale_quantile: 0.95
  fourier_flatline_atol: 1.0e-8
  fourier_fft_edge_mode: mirror_pad
  fourier_mirror_pad_frac: 0.25
  fourier_calibration_max_windows: 512
  eval_sampler: dpmpp
  window_norm_center: mean

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_finer_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only
