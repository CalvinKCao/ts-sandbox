extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_smoke.yaml

experiment:
  name: binary-anchor-ar-patch-decoder-local-smoke
  experiment_name: binary_anchor_ar_patch_decoder_local_smoke
  dataset: ETTh1
  n_variates: 7

training:
  skip_synthetic_tuning: true
  n_itrans_hp_trials: 1
  n_finetune_hp_trials: 1

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null
    n_samples: 1
    epochs: 1
    patience: 1

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear

  - phase: staged_eval
    n_samples: 1
    probabilistic_n_samples: 1
    probabilistic_num_inference_steps: 3
    skip_eval_visualizations: true

wandb:
  enabled: false
