extends: binary_anchor_ar.yaml

wandb:
  project: ts-sandbox-binary-anchor-ar-grad-accum

# Reuse SSOT pretrain + iTrans; tune diffusion LR (lr_only, 5 trials/stage).
phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_ar
  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar
  - phase: diffusion_coarse_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: diffusion_fine_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: staged_eval
