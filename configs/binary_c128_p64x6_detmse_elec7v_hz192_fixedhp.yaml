# Deterministic 2D CDF occupancy-MSE ablation, electricity 7v dedicated H=192.
# U=217 (not 321v leftover 1182). Seed 42 RandomState 7 indices.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x_nopretrain.yaml
replace_phases: true

geometry:
  forecast_length: 192
  lookback_overlap: 8

wandb:
  tags: [ablation_detmse, occupancy_mse, electricity, elec_7v_rand_s42, dedicated_h, hz192, canvas128, p64x6, nopretrain, from_random_init, fixed_hp, no_optuna, itrans_guid, unique_seg, u217, ms35, eval_anchor]

experiment:
  dataset: electricity
  name: binary-c128-p64x6-detmse-elec7v-hz192-fixedhp
  experiment_name: binary_c128_p64x6_detmse_elec7v_hz192_fixedhp
  n_variates: 7
  representation: cdf_2d
  occupancy_encoding: cdf
  prediction_target: occupancy_mse
  guidance_type: itransformer
  cache_cond_kv: true
  deterministic_anchor_loss: false
  train_time_coverage: 1.0
  max_scale: 3.5
  max_scale_by_dataset:
    electricity: 3.5
  config_nickname: detmse-p64-elec7v-s42-hz192-u217-ms35
  data_subset_by_dataset:
    electricity:
      subset_id: electricity_7v_rand_s42
      all_variates: false
      variate_indices: [9, 104, 119, 132, 173, 197, 250]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      electricity: 217
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      ema_decay: 0.99
      max_scale: 3.5
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: occupancy_mse
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      electricity: 217
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      ema_decay: 0.995
      max_scale: 3.5
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: occupancy_mse
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: detmse_p64_elec7v_s42_hz192_s1_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      electricity: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
