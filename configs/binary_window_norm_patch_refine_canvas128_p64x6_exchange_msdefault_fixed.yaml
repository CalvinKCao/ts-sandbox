# Exchange-rate control: current stage HPs with policy default max_scale=10.6.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_exchange_rate.yaml

wandb:
  tags: [control, fixed_hp, default_max_scale, exchange_rate, canvas128, p64x6]

experiment:
  name: binary-window-norm-patch-refine-c128-exchange-msdefault-fixed
  experiment_name: binary_window_norm_patch_refine_c128_exchange_msdefault_fixed

phases:
  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 10.6

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      batch_size: 8
      gradient_accumulation_steps: 4
      effective_univariate_batch: null
      target_univariate_batch: null
      ema_decay: 0.995
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 10.6
