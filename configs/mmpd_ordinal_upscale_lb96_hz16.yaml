# Oracle-coarse 1D MMPD discriminator kill test.
# Source windows and discriminator retain the binary run's 96-step lookback.
# MMPD itself receives only the final 8 points at 256-bin resolution plus the
# oracle 16-bin horizon, and predicts the 256-bin ordinal horizon.
experiment:
  name: mmpd-ordinal-upscale-lb96-hz16
  experiment_name: mmpd_ordinal_upscale_lb96_hz16

mmpd:
  task: ordinal_upscale
  backbone: Decoder
  lookback: 96
  condition_lookback: 8
  horizon: 16
  coarse_bins: 16
  high_bins: 256
  datasets: [ETTh1, exchange_rate, electricity, traffic]
  train_stride: 2
  test_stride: 4
  patch_size_default: 8
  d_model: 256
  d_ff: 512
  n_heads: 4
  d_layers: 2
  dropout: 0.2
  d_diffusion: 256
  diffusion_layers: 1
  max_diffusion_steps: 1000
  beta_schedule: linear
  radius: 3
  num_sampling_steps: 20
  train_epochs: 20
  patience: 5
  learning_rate: 1.0e-4
  point_weight: 0.01
  batch_size: 32
  tune_trials: 7
  tune_epochs: 10
  tune_patience: 3
  tune_params:
    learning_rate: [3.0e-5, 3.0e-4]
    point_weight: [0.005, 0.05]
    batch_size: [8, 32]
  disc_slice_len: 8
  disc_epochs: 8
  disc_batch_size: 64
  disc_lr: 1.0e-3
  disc_d_model: 128
  disc_d_ff: 256
  disc_n_heads: 4
  disc_depth: 2
  disc_dropout: 0.1
