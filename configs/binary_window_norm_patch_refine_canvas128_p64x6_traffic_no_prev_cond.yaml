# Freeze traffic canvas128 coarse (job 4597055) and retrain patch_refine with
# no left-neighbor refine in the coarse-cell aux map. Same 50% train-window
# fraction as the donor. Eval is s1 / 66% / n=10 / quad_t 4 (same windows as
# 4928420, fewer denoise steps).
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_traffic.yaml
replace_phases: true

wandb:
  tags: [ablation, window_norm, patch_refine, canvas128, p64x6, no_prev_cond, traffic, win_frac_0p5]

experiment:
  name: binary-window-norm-patch-refine-c128-traffic-no-prev-cond
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_traffic_no_prev_cond
  seed: 42
  patch_refine_use_prev_cond: false
  patch_refine_prev_cond_dropout: 0
  patch_refine_finetune_window_fraction: 0.5

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10
    reuse_checkpoint_from_config: binary_window_norm_patch_refine_earlyjuly_norm

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    reuse_checkpoint_dir: /scratch/ccao87/ts-sandbox/results/ckpts/08-04-4597055-traffic-binary_window_norm_patch_refine_canvas128_p64x6_traffic
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    retrain: true
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      batch_size: 36
      gradient_accumulation_steps: 1
      ema_decay: 0.995
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 2.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2
      target_univariate_batch: 256

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.66
    test_stride: 1
    eval_progress_key: canvas128_s1_n10_f66_noprev_steps4
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
