# Joint Optuna: continuous length_g ∈ [1,10] + LR + univariate batch {512,1024,2048}.
# Ranks trials by one-shot 2d→1d decoded val anchor MSE (diffusion val is not
# comparable across g). Reuses g=1 synth pretrain; train-window augs on finetune.
#
# Recipe: 30 trials × max 4ep (patience 2, Hyperband) → refit winner 20ep.
extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual.yaml

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - joint_g_lr_batch
    - reuse_g1_pretrain
    - search30_refit20
    - train_window_aug
    - anchor_mse_objective
    - repr_t1

training:
  train_window_aug:
    enabled: true
    apply_prob: 0.5
    acf_threshold: 0.35

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-joint-g-lr-batch-s30r20
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20
  binary_length_mode: power
  binary_length_scale: 1.0
  # Fallback only; Optuna overwrites per trial.
  binary_length_g: 1.0
  binary_length_g_by_dataset: {}
  data_subset:
    max_variates_by_dataset:
      dynamic: 2
    sample_stride_by_dataset:
      dynamic: 480

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_noise_sched_ablation_vertical_dual_g1p0

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: null

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 30
    max_epochs: 4
    patience: 2
    refit_best_max_epochs: 20
    refit_best_patience: 20
    search_space: lr_eff_batch_g
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 0.5
    hp_g_min: 1.0
    hp_g_max: 10.0
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [512, 1024, 2048]
    ema_decay: 0.995
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    binary_length_mode: power
    binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
