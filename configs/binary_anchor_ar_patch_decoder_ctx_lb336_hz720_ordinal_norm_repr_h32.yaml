# Compressed ordinal (stride=2), coarse/fine repr height 32 — retrain diffusion, reuse decoder.
#
# Same lb336/hz720 ordinal-norm patch-decoder campaign as ordinal_norm, but 2D ladder
# bins H=W=32 (default 16). Synthetic + coarse/fine diffusion are retrained; patch
# guidance is copied from the 07-08 ordinal_norm series (same decoder geometry).
#
# HP (no donor-file discovery for diffusion):
#   - synthetic diffusion: fixed_synthetic_diff_hp (06-02-3851278 ETTh1 binary_dual_scale_staged_patch48)
#   - coarse/fine: search_space=fixed + fixed_tuned_params from ..._fixed.yaml
# Patch guidance ckpts (from results/logs/07-08-412261{7-1}-*-ordinal_norm.log):
#   ETTh1         → .../07-08-4122617-.../ETTh1_patch_guidance.pt
#   weather       → .../07-08-4122618-.../weather_4v_s2_patch_guidance.pt
#   electricity   → .../07-08-4122619-.../electricity_4v_s1_patch_guidance.pt
#   exchange_rate → .../07-08-4122620-.../exchange_rate_patch_guidance.pt
#   traffic       → .../07-08-4122621-.../traffic_4v_s1_patch_guidance.pt
#
# Submit:
#   ./test_submit.sh --configs configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_repr_h32.yaml \
#     --datasets ETTh1,weather,electricity,exchange_rate,traffic --gpu l40s --time 10:00:00 \
#     --wandb-project ts-sandbox-leaderboard

extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm.yaml

wandb:
  tags: [patch_decoder, ordinal_norm, lb336_hz720, fixed_hp, repr_h32, reuse_decoder]

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ordinal-norm-repr-h32
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_repr_h32
  image_height: 32
  coarse_image_height: 32
  fine_image_height: 32

training:
  # Tuned on Killarney binary_dual_scale_staged_patch48 grid (ETTh1 donor 06-02-3851278).
  fixed_synthetic_diff_hp:
    learning_rate: 5.399484409787432e-4
    batch_size: 56
  skip_synthetic_tuning: true
  n_itrans_hp_trials: 1

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    reuse_pretrain_from_config: null
    shared_cache: false
    retrain_synthetic_itrans: true

  - phase: patch_guidance_finetune_hp
    # Newest *-{dataset}-binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm
    # (07-08-4122617..4122621 on Killarney).
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm

  - phase: diffusion_coarse_finetune_hp
    reuse_tuned_params_from: null
    retrain: true
    n_trials: 1
    max_epochs: 20
    patience: 8

  - phase: diffusion_fine_finetune_hp
    reuse_tuned_params_from: null
    retrain: true
    n_trials: 1
    max_epochs: 20
    patience: 8
