# Matched MMPD leaf for the coverage / dead-code probe (non-ordinal, instance-norm).
experiment:
  name: coverage-deadcode-mmpd
  experiment_name: coverage_deadcode_mmpd

mmpd:
  backbone: Decoder
  subset_config: coverage_deadcode_binary_patch_refine.yaml
  lookback: 336
  horizon: 96
  datasets:
    - coverage_synth
  patch_size_default: 12
  patch_size_wide: 24
  train_epochs: 1
  patience: 1
  learning_rate: 1.0e-4
  point_weight: 0.01
  dropout: 0.2
  ema_decay: 0
  batch_size: 2
  sample_num: 2
  num_sampling_steps: 5
  gmm_components: 1
  gmm_iterations: 1
  prior_pi_decay: 0.5
  prior_precision_shape: 100
  lradj: fixed
  tune_trials: 0
  leaderboard: false
