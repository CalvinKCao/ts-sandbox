# Smoke: staged 2-stage pipeline, DiT patches 8 (value) × 4 (time). In-job Phase-1 HP.
# Submit: ./submit_staged_patch_sweep.sh

experiment:
  name: binary-dual-scale-staged-smoke-p8w4
  experiment_name: binary-dual-scale-staged-smoke-p8w4
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  max_scale: 3.5
  window_norm_std_floor: 0.1
  max_scale_by_dataset:
    ETTh1: 5.2
    ETTh2: 9.0
    ETTm1: 7.7
    ETTm2: 9.0
    illness: 6.3
    exchange_rate: 10.6
    weather: 9.3
    electricity: 5.4
    traffic: 6.0
    PeMS: 11.8
    solar_Alabama: 13.0
    dalia: 6.0
  dit_patch_size: [8, 4]
  use_dual_scale: true
  dual_scale_fine_weight: 0.75
  dual_scale_independent_timesteps: true
  diffusion_stage: joint
  use_guidance_channel: false
  cfg_dropout: 0.0
  cfg_scale: 1.0
  use_cfg_inference: false
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  smoke_test: true
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  - phase: itrans_hp_pretrain
    n_trials: 1
    max_epochs: 1

  - phase: diffusion_hp_pretrain
    n_trials: 1
    max_epochs: 1
    patience: 1

  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged_smoke_p8w4
    epochs: 1
    patience: 1

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 1
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 1
    patience: 1

  - phase: staged_eval
    skip_eval_visualizations: true
