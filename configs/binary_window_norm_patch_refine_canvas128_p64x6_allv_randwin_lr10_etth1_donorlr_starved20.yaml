# Causal missing cell: lr10 STARVED fine recipe + donor LR 7.818e-4 + 20ep.
# Same skip-coarse / reuse 4964361 coarse as isolation 4984196.
# Isolation recovered val 0.0646 with FULL recipe (window/patch 1.0, anchor every
# batch). lr10 search trials sat at ~0.57 @ ep4. This job asks whether the
# starve knobs alone cause that floor when LR is the donor (not the 1.72e-3
# winner). No staged_eval. Unique-seg stays on (parent); there is no separate
# unique-seg-crop key — patch_fraction=0.5 is the train-only even-variate crop.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6.yaml
replace_phases: true

training:
  itrans_paper_batch_size: 1

wandb:
  tags: [all_variates, randwin, lr10, etth1, fine_only, donor_lr, starved, win_frac_0p5, patch_frac_0p5, anchor_every4, from_lr10_coarse_best, canvas128, p64x6]

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

experiment:
  name: binary-window-norm-patch-refine-c128-allv-randwin-lr10-etth1-donorlr-starved20
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_etth1_donorlr_starved20
  seed: 42
  patch_refine_finetune_window_fraction: 0.5
  patch_refine_finetune_patch_fraction: 0.5
  deterministic_anchor_every_n_batches: 4
  data_subset_by_dataset:
    ETTh1:
      subset_id: ETTh1_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 8209
      val_max_windows: 2785

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10
    reuse_checkpoint_dir: /scratch/ccao87/ts-sandbox-allv-randwin-lr10/results/ckpts/08-22-4964361-ETTh1-binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    reuse_checkpoint_dir: /scratch/ccao87/ts-sandbox-allv-randwin-lr10/results/ckpts/08-22-4964361-ETTh1-binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    retrain: true
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      batch_size: 36
      gradient_accumulation_steps: 1
      ema_decay: 0.995
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 2.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2
      target_univariate_batch: 256
