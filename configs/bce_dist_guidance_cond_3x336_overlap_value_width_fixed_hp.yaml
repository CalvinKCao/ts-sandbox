# Fixed-HP Narval rerun: reuse the prior cond-chunk synthetic and patch-guidance checkpoints.
# Ablation vs bce_dist: move patch-decoder guidance off the forecast canvas
# onto lookback-width visual cond as 3×336 chunk channels
# (first chunk is overlap 0-7 plus guidance 0-327; remaining chunks preserve guidance order).
# The repack preserves three cond channels; fixed HPs are copied from the prior bce_dist search.

extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual_joint_g_lr_batch_s30r20_bce_dist.yaml

training:
  train_window_aug:
    exclude_names: [linear_trend]

wandb:
  tags:
    - patch_decoder
    - ordinal_norm
    - lb336_hz720
    - uncompressed
    - vertical_dual
    - joint_g_lr_batch
    - fixed_hp_from_bce_dist
    - train_window_aug_no_linear_trend
    - anchor_mse_objective
    - anchor_bce_dist_no_soft_mse
    - guidance_cond_3x336
    - repr_t1
    - overlap_guidance_repack
    - normalized_value_width_bce

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vd-guidance-overlap-value-width-fixed-hp
  experiment_name: bce_dist_guidance_cond_3x336_overlap_value_width_fixed_hp
  anchor_mse_proxy_lambda: 1.0
  binary_use_boundary_weighted_bce: true
  binary_cdf_distance_alpha: 1.0
  binary_use_normalized_value_width_weighted_bce: true
  # use_guidance_channel stays true (inherited); placement routes to cond chunks.
  guidance_placement: cond_chunks

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: bce_dist_guidance_cond_3x336_narval_fresh_fixed_hp_temp

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: bce_dist_guidance_cond_3x336_narval_fresh_fixed_hp_temp

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    # Clear joint parent Hyperband→refit (avoid 20ep train + 20ep refit).
    refit_best_max_epochs: null
    refit_best_patience: null
    search_space: fixed
    hp_objective: anchor_mse
    hp_anchor_eval_val_fraction: 0.5
    fixed_tuned_params:
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_scale: 1.0
    fixed_tuned_params_by_dataset:
      ETTh1:
        learning_rate: 0.00036714090880850866
        target_univariate_batch: 512
        binary_length_g: 1.1684275177431984
      traffic:
        learning_rate: 0.0012606339523889608
        target_univariate_batch: 512
        binary_length_g: 9.690688297671034
      exchange_rate:
        learning_rate: 0.00013002903021971986
        target_univariate_batch: 1024
        binary_length_g: 1.2776228386407587

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
