extends: base/binary_staged.yaml

experiment:
  name: ordinal-d3pm-staged
  diffusion_type: ordinal_d3pm
  d3pm_transition_max: 0.3
  d3pm_transition_min: 1.0e-5
  d3pm_noise_schedule: sqrt_linear
  prediction_target: x0
  loss_weighting: none

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: ordinal_d3pm_staged
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 7
    max_epochs: 20
    patience: 8
    search_space: ordinal_d3pm

  - phase: diffusion_fine_finetune_hp
    n_trials: 7
    max_epochs: 20
    patience: 8
    search_space: ordinal_d3pm

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
