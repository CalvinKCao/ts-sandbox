# Subset policy for paper-horizon MMPD / iTransformer / PatchTST comparison.
# data_subset (all_variates, strides, train/val caps) from cap1x2x.
# Eval: seed-42 10% random windows (rolling origins).
# No eval_max_windows — fraction and a hard cap cannot both apply.
#
# Used as MMPD subset_config and as --subset-yaml for canvas128 baselines.
# Not a binary training leaf.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x.yaml
replace_phases: true

experiment:
  name: compare-baselines-allv-seed42-frac10
  experiment_name: compare_baselines_allv_seed42_frac10
  seed: 42

phases:
  - phase: staged_eval
    # seed-42 10% random windows (rolling origins)
    eval_test_fraction: 0.1
    eval_max_windows_by_dataset: null
    test_stride: 1
    skip_eval_visualizations: true
    eval_progress_key: compare_baselines_allv_seed42_frac10
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    gmm_components: 10
    topk_max: 3
