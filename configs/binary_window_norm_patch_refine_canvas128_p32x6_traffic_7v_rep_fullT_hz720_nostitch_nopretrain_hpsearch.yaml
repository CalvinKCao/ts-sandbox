# Traffic 7 representative variates: 10+10 HP search (default LR / U=217x{1,2,4},
# EMA fixed 0.995). Coarse also tunes max_scale in [3, 7]; fine also tunes
# patch_refine height in {16, 32, 48, 64}. Full 7v windows, no frac50 refit.
# Indices from reports/traffic-7v-representative/ (train-split PAM k-medoids).
# Parent all_variates:true must be cleared or merge would ignore the 7-list.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_fullT_hz720_nostitch_nopretrain_fixedhp_r0_ms35_kv.yaml
replace_phases: true

wandb:
  tags: [traffic, traffic_7v_rep, canvas128, p32x6, nopretrain, from_random_init, hz720, nostitch, itrans_guid, hpsearch, lr_batch_ema, ema995, max_scale_3_7, patch_h_16_32_48_64, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile]

experiment:
  name: binary-c128-p32x6-traffic-7v-rep-fullT-hz720-hpsearch
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_traffic_7v_rep_fullT_hz720_nostitch_nopretrain_hpsearch
  n_variates: 7
  patch_refine_patch_height: 32
  config_nickname: c128-p32-traffic-7v-rep-hz720-hpsearch-ema995
  data_subset_by_dataset:
    traffic:
      subset_id: traffic_7v_rep_s1
      all_variates: false
      variate_indices: [14, 50, 102, 144, 314, 491, 825]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    max_univariate_micro_batch_by_dataset:
      traffic: 217
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.995]
    hp_max_scale_min: 3.0
    hp_max_scale_max: 7.0
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.995
        max_scale: 3.5
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    max_univariate_micro_batch_by_dataset:
      traffic: 217
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.995]
    hp_patch_refine_height_grid: [16, 32, 48, 64]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
        patch_refine_patch_height: 32
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_p32x6_traffic_7v_rep_hz720_hpsearch_s1_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      traffic: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
