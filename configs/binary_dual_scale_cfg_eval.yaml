# Eval-only: CFG inference sweep on existing binary_dual_scale checkpoints.
# Submit with submit_cfg_ablation.sh (reuses ckpts/*-{dataset}-binary_dual_scale).
# Do NOT use submit_grid.sh with this file unless you pass explicit --checkpoint-dir.

experiment:
  name: binary-dual-scale-cfg-eval
  experiment_name: binary-dual-scale-cfg-eval
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  use_dual_scale: true
  dual_scale_fine_weight: 0.75
  dual_scale_independent_timesteps: true
  use_variate_embedding: true
  variate_factorized: true
  cfg_dropout: 0.1
  cfg_scale: 2.0
  use_cfg_inference: true
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  - phase: eval
    # Deterministic metrics use eval_sampler=anchor once; probabilistic metrics
    # use a separate non-anchor stochastic sampler.
    n_samples: 1
    probabilistic_n_samples: 100
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
