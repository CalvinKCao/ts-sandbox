# Weather allv_randwin cap1x2x: iTransformer encoder tokens for DiT x-attn
# (no 2D guidance channel). With-pre diffusion, locked weather with-pre HPs.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_randwin_lr10_cap1x2x.yaml
replace_phases: true

wandb:
  tags: [ablate, weather_allv_randwin, itrans_guid, all_variates, randwin, canvas128, p32x6, from_pretrain, fixed_hp, no_optuna, hz96, caps_crops_1x2x_etth1]

experiment:
  dataset: weather
  name: binary-window-norm-patch-refine-c128-p32x6-weather-allv-itrans-guid-fixedhp
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_weather_allv_itrans_guid_fixedhp
  config_nickname: c128-weather-allv-itrans-guid-fixedhp
  guidance_type: itransformer

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p32x6_pretrain
    require_reuse_pretrain: true

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0003798424000105789
      ema_decay: 0.995
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 0.0012313680415535365
      ema_decay: 0.99
      target_univariate_batch: 434
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: weather_allv_itrans_guid_fixedhp_s1_n10_steps4
    eval_max_windows_by_dataset:
      weather: 1313
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size_by_dataset:
      weather: 5
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
