# Eval-only: reuse trained coarse + patch_refine ckpts; refresh pred visualizations.
# Submit with --resume --ckpt-config binary_patch_refine_lb336_hz96_full
#
# Patch-refine eval is ~15× denser than residual fine (≈16 crops/variate × 20 samples),
# so full test (traffic≈854 windows) can run many hours. Cap to a deterministic subset
# that should finish in <2h on L40S.
extends: configs/binary_patch_refine_lb336_hz96_full.yaml
replace_phases: true

wandb:
  tags: [patch_refine, lb336_hz96, full, eval_viz]

experiment:
  name: binary-patch-refine-lb336-hz96-full-eval-viz
  experiment_name: binary_patch_refine_lb336_hz96_full_eval_viz

phases:
  - phase: staged_eval
    skip_eval_visualizations: false
    refresh_eval_visualizations: true
    # ~70–85 windows on ETTh1/traffic; dynamic already stride-480 sparse.
    eval_test_fraction: 0.1
    eval_test_fraction_by_dataset:
      traffic: 0.08
      dynamic: 0.25
      exchange_rate: 0.15
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 8
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
