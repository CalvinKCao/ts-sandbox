# Re-run staged_eval with prediction visualizations against completed full runs.
# Resume with --ckpt-config binary_patch_refine_lb336_hz96_full so FT/pretrain ckpts reuse.
extends: configs/binary_patch_refine_lb336_hz96_full.yaml

wandb:
  tags: [patch_refine, lb336_hz96, full, eval_viz]

experiment:
  name: binary-patch-refine-lb336-hz96-full-eval-viz
  experiment_name: binary_patch_refine_lb336_hz96_full_eval_viz

phases:
  - phase: staged_eval
    skip_eval_visualizations: false
    refresh_eval_visualizations: true
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
