# Ordinal h96 patch-refine from random init (no synth / donor pretrain).
# Compensates with more Optuna trials and a higher LR ceiling; EMA fixed at 0.99.
extends: configs/binary_patch_refine_lb336_hz96_ordinal_tuned.yaml
replace_phases: true

training:
  n_finetune_hp_trials: 5

wandb:
  tags: [patch_refine, ordinal_norm, lb336_hz96, tuned, from_scratch, no_pretrain]

experiment:
  name: binary-patch-refine-lb336-hz96-ordinal-tuned-from-scratch
  experiment_name: binary_patch_refine_lb336_hz96_ordinal_tuned_from_scratch
  use_window_normalization: false
  use_ordinal_window_norm: true
  ordinal_ood_shift_causal_only: true
  patch_refine_unique_segments: true
  patch_refine_prev_cond_dropout: 0.5

phases:
  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_eff_batch_univariate_ema
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-2
    effective_univariate_batch_grid: [512, 1024, 2048]
    ema_decay_grid: [0.99]
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_eff_batch_univariate_ema
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-2
    # Same L40S-safe ladder as ordinal_tuned (crop expansion ~17x).
    effective_univariate_batch_grid: [64, 128, 256]
    ema_decay_grid: [0.99]
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear

  # Full staged_eval block required under replace_phases (merge cannot inherit keys).
  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 16
    n_samples: 1
    probabilistic_n_samples: 4
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
