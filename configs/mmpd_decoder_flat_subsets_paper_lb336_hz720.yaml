# MMPD Decoder — paper-fixed hparams, lb336/hz720, flat subsets (no Optuna).
#
# Same training defaults as mmpd_decoder_flat_subsets_paper_lb336_hz96.yaml but horizon=720.
# Full-resolution windows (no diffusion-style repr subsampling).
#
# Parallel Slurm sweep (Killarney login node):
#   cd $SCRATCH/ts-sandbox && ./submit_mmpd.sh --mmpd-run-config mmpd_decoder_flat_subsets_paper_lb336_hz720 \
#     --output-dir results/datasets/$(date +%m-%d)-mmpd-decoder-paper-lb336-hz720-subset \
#     --time 24:00:00 --mmpd-tune-trials 0
#
# Smoke:
#   ./submit_mmpd.sh --mmpd-run-config mmpd_decoder_flat_subsets_paper_lb336_hz720 --smoke-test --datasets ETTh1

experiment:
  name: mmpd-decoder-flat-subsets-paper-lb336-hz720
  experiment_name: mmpd_decoder_flat_subsets_paper_lb336_hz720

mmpd:
  backbone: Decoder
  subset_config: binary_anchor_ar.yaml
  lookback: 336
  horizon: 720
  datasets:
    - ETTh1
    - ETTh2
    - ETTm1
    - ETTm2
    - exchange_rate
    - weather
    - electricity
    - traffic
    - PeMS
    - solar_Alabama
    - dynamic
  patch_size_default: 12
  patch_size_wide: 24
  train_epochs: 20
  patience: 5
  learning_rate: 1.0e-4
  point_weight: 0.01
  dropout: 0.2
  ema_decay: 0
  batch_size: 32
  sample_num: 20
  num_sampling_steps: 20
  gmm_components: 10
  gmm_iterations: 10
  prior_pi_decay: 0.5
  prior_precision_shape: 100
  lradj: fixed
  tune_trials: 0
  leaderboard: true
  leaderboard_nickname: "MMPD Subset Recent"
