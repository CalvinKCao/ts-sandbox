experiment:
  name: binary-dual-scale-staged
  experiment_name: binary-dual-scale-staged
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  max_scale: 3.5
  window_norm_std_floor: 0.1
  # Per-dataset q99.5 of |(future - past_window_mean) / max(past_window_std, 0.1)| on train windows.
  max_scale_by_dataset:
    ETTh1: 5.2
    ETTh2: 9.0
    ETTm1: 7.7
    ETTm2: 9.0
    illness: 6.3
    exchange_rate: 10.6
    weather: 9.3
    electricity: 5.4
    traffic: 6.0
    PeMS: 11.8
    solar_Alabama: 13.0
    dalia: 6.0
  dit_patch_size: [8, 8]
  use_dual_scale: false
  diffusion_stage: joint
  use_guidance_channel: false
  cfg_dropout: 0.0
  cfg_scale: 1.0
  use_cfg_inference: false
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  # Phase 1 HP: newest *-<dataset>-binary_dual_scale under $STORE/ckpts (05-31 grid).
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale

  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 20
    tune_data_fraction: 0.5
    hp_max_epochs: 12
    hp_patience: 4
    final_max_epochs: 20
    final_patience: 8

  - phase: diffusion_fine_finetune_hp
    n_trials: 20
    tune_data_fraction: 0.5
    hp_max_epochs: 12
    hp_patience: 4
    final_max_epochs: 20
    final_patience: 8

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 2
    n_samples: 1
    probabilistic_n_samples: 100
    tune_sampler: true
    sampler_tune_fraction: 0.25
    sampler_tune_probabilistic_n_samples: 8
    sampler_tune_candidates: [ddim, dpmpp]
    sampler_tune_steps: [10, 20, 40]
    sampler_tune_metric: top3_mse
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    skip_eval_visualizations: false

visualization:
  enabled: true
  n_samples: 3
  n_dual_scale_vars: 3
  jpeg_dpi: 100
