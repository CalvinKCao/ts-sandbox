# Eval-only canvas128 ETTh1: stride 1, 10% windows, 10 MC samples, 20 quad_t steps.
# Matched 10% control for the 8/12-step ablation. Resume:
# results/eval_resume/canvas128_s1_n10_f10_steps20/
# Absolute ckpt path so this leaf works from a pre-xattn worktree.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6.yaml
replace_phases: true

wandb:
  tags: [evaluation_only, canvas128, stride1, n10, f10, steps20, ETTh1]

experiment:
  name: binary-window-norm-patch-refine-c128-etth1-eval-s1-n10-f10-steps20
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_etth1_eval_s1_n10_f10_steps20
  seed: 42
  eval_source_checkpoint_dir: /scratch/ccao87/ts-sandbox/results/ckpts/08-03-4571065-ETTh1-binary_window_norm_patch_refine_canvas128_p64x6

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

phases:
  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 0.10
    test_stride: 1
    eval_progress_key: canvas128_s1_n10_f10_steps20
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: false
