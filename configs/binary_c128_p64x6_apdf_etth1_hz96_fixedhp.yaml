# APDF (one-hot columns) ablation, ETTh1 dedicated H=96.
# Table Binary HPs frozen: p64x6, max_scale 5.2, U=217 1x, donor LRs, unique-seg,
# iTrans nopre. Eval-anchor n=1838 like table jobs 5474030/31/33/34.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x_nopretrain_itrans_hz96.yaml
replace_phases: true

wandb:
  tags: [ablation_apdf, one_hot, ETTh1, dedicated_h, hz96, canvas128, p64x6, nopretrain, from_random_init, fixed_hp, no_optuna, itrans_guid, unique_seg, u217, ms52, eval_anchor]

experiment:
  name: binary-c128-p64x6-apdf-etth1-hz96-fixedhp
  experiment_name: binary_c128_p64x6_apdf_etth1_hz96_fixedhp
  occupancy_encoding: one_hot
  guidance_type: itransformer
  max_scale: 5.2
  max_scale_by_dataset:
    ETTh1: 5.2
  config_nickname: apdf-p64-etth1-hz96-u217-ms52

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      ema_decay: 0.99
      max_scale: 5.2
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 5.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 1
    max_epochs: 20
    patience: 5
    search_space: fixed
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      ema_decay: 0.995
      max_scale: 5.2
      target_univariate_batch: 217
      binary_noise_schedule: linear
      loss_weighting: none
      min_snr_gamma: 2.0
      prediction_target: epsilon
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: apdf_p64_etth1_hz96_s1_n1_anchor
    eval_max_windows_by_dataset:
      ETTh1: 1838
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      ETTh1: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
