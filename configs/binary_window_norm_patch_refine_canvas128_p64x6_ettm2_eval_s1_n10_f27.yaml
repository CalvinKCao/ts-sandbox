  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_ettm2_eval_s1_n10_f27
  eval_source_checkpoint_dir: /scratch/ccao87/ts-sandbox/results/ckpts/08-05-4623008-ETTm2-binary_window_norm_patch_refine_canvas128_p64x6_ettm2

