extends: binary_anchor_stationary_flat_subsets_ema099.yaml

wandb:
  project: ts-sandbox-flat-subsets-grad-accum-no-guidance

experiment:
  name: binary-anchor-stationary-flat-subsets-grad-accum-400
  experiment_name: binary_anchor_stationary_flat_subsets_grad_accum_400
  use_guidance_channel: false

training:
  diffusion_effective_batch_multiplier: 4.0
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002

# No iTrans 2D ghost / guidance channel; reuse ema099 pretrain + iTrans.
phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_stationary_flat_subsets_ema099
  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_stationary_flat_subsets_ema099
  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: diffusion_fine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: staged_eval
