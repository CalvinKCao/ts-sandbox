# Nopretrain clone of H96 cap1x2x p64 (Killarney 5057773 ETTh1). Same subset
# keys / Optuna search / from_random_init; geometry + eval B=1 only.
# iTransformer tokens for DiT x-attn (not patch-decoder).
# Subsets: ETTh1 5057773 (allv s1, train/val caps 15153/4305, eval 1838).
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x_nopretrain.yaml

geometry:
  forecast_length: 720
  horizon_stitch: false
  lookback_overlap: 8

wandb:
