# Dynamic 8v (7 PAM + raw col 1), T=20k, L=600 H=300. Weather leftover HP +
# sticky/discrete. Chronological prefix max_series_timesteps: 20000 (solar
# T=30k pattern). ~13k stride-1 train windows; diffusion train_max_windows
# stays null. iTrans keeps 20k/3k. Sticky (>30% consecutive-equal): keep IN,
# per-variate floor so <5% of train windows clip at ±max_scale. Discrete
# (<4 unique): skip IN, map 1st/2nd most common values onto adjacent
# coarse-bin midpoints. Not hybrid_flat.
# Vast A100-80GB coarse U=2192 (the 7v probe; 8v is still univariate-U). Fine
# is probed on this GPU (an older A100 patch_refine run only fit U=16).
# Multipliers {1,2,4} are grad-accum. Killarney dynamic1 keeps L40S U=1315.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_dynamic_7v_rep_lb600_hz300_nostitch_nopretrain_hpsearch_weathergrid.yaml
replace_phases: true

wandb:
  tags: [dynamic, dynamic_8v_rep, T20k, canvas128, p32x6, nopretrain, from_random_init, lb600, hz300, nostitch, itrans_guid, hpsearch, lr_batch_ema, weathergrid, ema_coarse_098_099_0995, ema_fine_099_0995_0999, max_scale_35_frozen, patch_h_32_frozen, sel_valloss, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile, sticky_discrete, u2192_probe_fine, vast_a100, pam_plus_v1]

experiment:
  name: binary-c128-p32x6-dynamic-8v-rep-lb600-hz300-hpsearch-weathergrid-stickycap
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_dynamic_7v_rep_lb600_hz300_nostitch_nopretrain_hpsearch_weathergrid_stickycap
  n_variates: 8
  use_window_normalization: true
  window_norm_center: mean
  window_norm_std_floor: 0.1
  sticky_discrete_dataset_norm: true
  sticky_inorm_frac_threshold: 0.3
  sticky_inorm_window_clip_coverage: 0.95
  discrete_coarse_align_max_uniques: 3
  config_nickname: c128-p32-dynamic-8v-weathergrid-stickycap
  data_subset_by_dataset:
    dynamic:
      subset_id: dynamic_8v_rep_T20k_s1_weathergrid_stickycap
      all_variates: false
      variate_indices: [0, 1, 3, 6, 7, 9, 13, 14]
      n_variates: 8
      max_series_timesteps: 20000
      train_stride: 1
      val_stride: 1
      test_stride: 300
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10
    train_max_windows: 20000
    val_max_windows: 3000

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: val_loss
    refit_best_max_epochs: 20
    refit_best_patience: 5
    max_univariate_micro_batch_by_dataset:
      dynamic: 2192
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.99
    ema_decay_grid: [0.98, 0.99, 0.995]
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.99
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: val_loss
    probe_univariate_micro_batch_once: true
    refit_best_max_epochs: 20
    refit_best_patience: 5
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.99, 0.995, 0.999]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 300
    eval_progress_key: canvas128_p32x6_dynamic_8v_weathergrid_stickycap_s300_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      dynamic: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
