# Cheap isolation vs 4988881 (~0.42) and donor 4571065 (~0.39).
# Skip Optuna: 1 trial, search_space fixed, donor LRs, 20ep, patience 8,
# train from previous-stage / pretrain weights (not a search ckpt).
# Same ETTh1 allv-randwin subset + eval as the lr10 campaign. Window/patch
# 1.0, anchor every batch (donor), not the lr10 every-4 starve knob.
# If test MSE ~0.39, the 10-trial search loop is the problem. If still
# ~0.42, it is not patience.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6.yaml
replace_phases: true

training:
  itrans_paper_batch_size: 1

wandb:
  tags: [all_variates, randwin, etth1, donor_lr, fixed_hp, no_optuna, patience_8, from_pretrain, canvas128, p64x6, eval_s1_n10_steps4]

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

experiment:
  name: binary-window-norm-patch-refine-c128-allv-randwin-etth1-donorlr-fixed20
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_etth1_donorlr_fixed20
  seed: 42
  patch_refine_finetune_window_fraction: 1.0
  patch_refine_finetune_patch_fraction: 1.0
  data_subset_by_dataset:
    ETTh1:
      subset_id: ETTh1_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 8209
      val_max_windows: 2785

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: patch_guidance_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    # 4571065 / early-July 4037033 coarse winner.
    fixed_tuned_params:
      learning_rate: 0.00016260630766856958
      batch_size: 42
      gradient_accumulation_steps: 2
      ema_decay: 0.99
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 5.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: fixed
    # 4571065 / bridge 4519745 fine winner. Omit target_univariate_batch so a
    # 16-window L40S probe cannot replan away from donor batch 36 / accum 1.
    fixed_tuned_params:
      learning_rate: 0.0007817554354066733
      batch_size: 36
      gradient_accumulation_steps: 1
      ema_decay: 0.995
      prediction_target: epsilon
      loss_weighting: none
      min_snr_gamma: 2.0
      use_deterministic_anchor_loss: true
      deterministic_anchor_lambda: 0.99
      deterministic_anchor_alpha: 0.0
      binary_noise_schedule: linear
      binary_length_mode: none
      binary_length_g: 1.0
      binary_length_scale: 1.0
      max_scale: 5.2

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_allv_randwin_etth1_donorlr_fixed20_s1_n10_steps4
    eval_max_windows_by_dataset:
      ETTh1: 1838
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    batch_size: 5
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
