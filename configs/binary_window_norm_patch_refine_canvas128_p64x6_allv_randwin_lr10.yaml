# allv-randwin HP search: 10 trial attempts/stage (COMPLETE+PRUNED+FAIL), 20 epochs with
# patience 5, median pruner (startup 3, warmup 8 → first prune at epoch 9). Next stage
# resumes from the best trial checkpoint (no from-pretrain refit). Search: donor LR ±10x,
# effective univariate batch via [1,2,4]× probed U, EMA default ± one neighbor. Donor
# trial is enqueued at 1× U.
# Window/patch fractions are 1.0 (full data, all variate crops).
# ETTm/PeMS use donor-like train/val strides (s3/s4/s2) so search is not stride-1 dense.
# Other datasets keep the lr4 random-window caps. Eval still s1 n10 4-step.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6.yaml
replace_phases: true

training:
  itrans_paper_batch_size: 1

wandb:
  tags: [all_variates, randwin, lr10, canvas128, p64x6, win_frac_1, patch_frac_1, lr_batch_ema, anchor_every4, eval_s1_n10_steps4, median_pruner, patience_5, from_pretrain]

visualization:
  viz_binary_mmpd_gap: false
  viz_binary_mmpd_redbox: false

experiment:
  name: binary-window-norm-patch-refine-c128-allv-randwin-lr10
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10
  seed: 42
  patch_refine_finetune_window_fraction: 1.0
  patch_refine_finetune_patch_fraction: 1.0
  deterministic_anchor_every_n_batches: 4
  data_subset_by_dataset:
    ETTh1:
      subset_id: ETTh1_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 8209
      val_max_windows: 2785
    ETTh2:
      subset_id: ETTh2_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 8209
      val_max_windows: 2785
    ETTm1:
      subset_id: ETTm1_allv_randwin_s3
      all_variates: true
      train_stride: 3
      val_stride: 3
      test_stride: 1
    ETTm2:
      subset_id: ETTm2_allv_randwin_s4
      all_variates: true
      train_stride: 4
      val_stride: 4
      test_stride: 1
    electricity:
      subset_id: electricity_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 716
      val_max_windows: 242
    traffic:
      subset_id: traffic_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 266
      val_max_windows: 90
    exchange_rate:
      subset_id: exchange_rate_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 4880
      val_max_windows: 665
    weather:
      subset_id: weather_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 10945
      val_max_windows: 3713
    solar_Alabama:
      subset_id: solar_Alabama_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 1677
      val_max_windows: 569
    PeMS:
      subset_id: PeMS_allv_randwin_s2
      all_variates: true
      train_stride: 2
      val_stride: 2
      test_stride: 1
      # Same ~230k-crop randwin budget as weather/electricity/traffic (V=307).
      # Cap samples from the s2 pool (floor(229840/307)=748, floor(77700/307)=253).
      train_max_windows: 748
      val_max_windows: 253
    illness:
      subset_id: illness_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      # Row split is Dataset_Custom 70/10/20 in _paper_split_borders (illness
      # branch), matching iTransformer/PatchTST national_illness. Not 60/20/20.
    dynamic:
      subset_id: dynamic_allv_randwin
      all_variates: true
      train_stride: 1
      val_stride: 1
      test_stride: 1
      # Same ~230k-crop randwin budget as weather/electricity/traffic (V=17).
      train_max_windows: 13520
      val_max_windows: 4586

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    reuse_pretrain_from_config: binary_window_norm_patch_refine_canvas128_p64x6
    require_reuse_pretrain: true

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    # L40S probe 5008723, headroom 0.85. max_fit hit search cap 256 on every
    # dataset/stage (including traffic 862v coarse). usable = int(256*0.85)=217.
    # HP grid is [1,2,4]× this U via grad accum. Enqueue injects 1× U (not 336).
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
      ETTh2: 217
      ETTm1: 217
      ETTm2: 217
      exchange_rate: 217
      weather: 217
      electricity: 217
      solar_Alabama: 217
      PeMS: 217
      traffic: 217
      illness: 217
      dynamic: 217
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.99
    ema_decay_grid: [0.98, 0.99, 0.995]
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.99
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    # L40S probe 5008723, headroom 0.85. max_fit hit search cap 256 on every
    # dataset/stage (including traffic 862v coarse). usable = int(256*0.85)=217.
    # HP grid is [1,2,4]× this U via grad accum. Enqueue injects 1× U (not 336).
    max_univariate_micro_batch_by_dataset:
      ETTh1: 217
      ETTh2: 217
      ETTm1: 217
      ETTm2: 217
      exchange_rate: 217
      weather: 217
      electricity: 217
      solar_Alabama: 217
      PeMS: 217
      traffic: 217
      illness: 217
      dynamic: 217
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.99, 0.995, 0.999]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: false
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_allv_randwin_lr10_s1_n10_steps4
    eval_max_windows_by_dataset:
      ETTh1: 1838
      ETTh2: 1838
      ETTm1: 1959
      ETTm2: 1942
      electricity: 42
      traffic: 10
      exchange_rate: 939
      weather: 1313
      solar_Alabama: 100
      PeMS: 50
      dynamic: 1622
    n_samples: 1
    probabilistic_n_samples: 10
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 4
    # L40S eval probes, n_samples=10, n_chunks=1. Small-V max_fit=54 -> 5.
    # electricity 4964367 max_fit=10 -> 1. PeMS lr4 4946713 max_fit=11 -> 1.
    # traffic 862v: no eval probe (4964633 never reached eval); 431v shards
    # max_fit=6 so 862v cannot exceed 1 at n=10.
    batch_size_by_dataset:
      ETTh1: 5
      ETTh2: 5
      ETTm1: 5
      ETTm2: 5
      exchange_rate: 5
      weather: 5
      solar_Alabama: 5
      electricity: 1
      PeMS: 1
      traffic: 1
      illness: 5
      dynamic: 5
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
