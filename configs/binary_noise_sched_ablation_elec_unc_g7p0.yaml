# Short 336/720_uncompressed schedule ablation: power g=7.0 (CRPS-targeted extended grid).
extends: configs/binary_noise_sched_ablation_elec_unc_g1p0.yaml

wandb:
  tags: [noise_sched_ablation, uncompressed, g7p0, crps_grid]

experiment:
  name: binary-noise-sched-ablation-elec-unc-g7p0
  experiment_name: binary_noise_sched_ablation_elec_unc_g7p0
  binary_length_mode: power
  binary_length_g: 7.0
  binary_length_scale: 1.0

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 4
    patience: 4
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_g: 7.0
      binary_length_scale: 1.0

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 4
    patience: 4
    search_space: fixed
    fixed_tuned_params:
      learning_rate: 2.41e-4
      ema_decay: 0.995
      prediction_target: x0
      loss_weighting: min_snr
      min_snr_gamma: 2.0
      binary_noise_schedule: linear
      binary_length_mode: power
      binary_length_g: 7.0
      binary_length_scale: 1.0

  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
