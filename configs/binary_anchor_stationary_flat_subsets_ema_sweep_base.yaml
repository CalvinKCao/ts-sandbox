extends: binary_anchor_stationary_flat_subsets.yaml

wandb:
  enabled: true
  project: ts-sandbox-flat-subsets-ema-sweep

# Reuse synthetic pretrain + iTransformer from completed flat-subset runs;
# diffusion coarse/fine/finer HP finetune re-runs with training.diffusion_ema_decay.
phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_stationary_flat_subsets
  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_stationary_flat_subsets
