# Electricity 7v occupancy baseline, same family as Killarney solar1 weathergrid.
# Table uncapped instance norm (floor 0.1). Weather leftover HP (lr/EMA/accum).
# Geometry matches original electricity occupancy Binary (lb336 hz96), not H=720
# texture and not the H=192 1D/APDF/detmse ablations. Full T (series is ~26k).
# Indices: existing electricity_7v_rand_s42 seed-42 subset, not a new PAM picker.
# Micro U copied from solar1 L40S (3200/2012) — same canvas H=96 p32, 7 variates.
# 3947/2483 OOM'd solar coarse on L40S 44GB; multipliers {1,2,4} are grad-accum.
# selection_metric: val_loss. 7v search + same-7v refit_best (no 321v allv refit).
# Parent all_variates:true / train_max_windows:165 must be cleared or merge keeps 321v.
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_fullT_hz720_nostitch_nopretrain_fixedhp_r0_ms35_kv.yaml
replace_phases: true

geometry:
  lookback_length: 336
  forecast_length: 96
  lookback_overlap: 8
  diffusion_lookback_cap: 336
  past_cond_resize_to_horizon: false
  itrans_lookback_length: 336

wandb:
  tags: [electricity, electricity_7v_rep, elec_7v_rand_s42, canvas128, p32x6, nopretrain, from_random_init, lb336, hz96, nostitch, itrans_guid, hpsearch, lr_batch_ema, weathergrid, ema_coarse_098_099_0995, ema_fine_099_0995_0999, max_scale_35_frozen, patch_h_32_frozen, sel_valloss, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile, table_inorm, u3200_2012, killarney_l40s]

experiment:
  dataset: electricity
  name: binary-c128-p32x6-electricity-7v-rep-fullT-lb336-hz96-hpsearch-weathergrid
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_electricity_7v_rep_fullT_lb336_hz96_nostitch_nopretrain_hpsearch_weathergrid
  n_variates: 7
  patch_refine_patch_height: 32
  patch_refine_unique_segments: true
  use_window_normalization: true
  window_norm_center: mean
  window_norm_std_floor: 0.1
  max_scale: 3.5
  config_nickname: c128-p32-elec-7v-fullT-weathergrid-valloss
  data_subset_by_dataset:
    electricity:
      subset_id: electricity_7v_rand_s42
      all_variates: false
      variate_indices: [9, 104, 119, 132, 173, 197, 250]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: val_loss
    refit_best_max_epochs: 20
    refit_best_patience: 5
    max_univariate_micro_batch_by_dataset:
      electricity: 3200
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.99
    ema_decay_grid: [0.98, 0.99, 0.995]
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.99
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate_ema
    selection_metric: val_loss
    refit_best_max_epochs: 20
    refit_best_patience: 5
    max_univariate_micro_batch_by_dataset:
      electricity: 2012
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1, 2, 4]
    ema_decay: 0.995
    ema_decay_grid: [0.99, 0.995, 0.999]
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
        ema_decay: 0.995
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 1
    eval_progress_key: canvas128_p32x6_elec_7v_fullT_weathergrid_valloss_s1_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      electricity: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
