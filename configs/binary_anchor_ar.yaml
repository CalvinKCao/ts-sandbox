extends: base/binary_staged.yaml

experiment:
  name: binary-anchor-ar
  experiment_name: binary_anchor_ar
  binary_anchor_input_mode: stationary_flat
  lookback_length: 96
  forecast_length: 96
  lookback_overlap: 8
  diffusion_chunk_horizon: 96
  diffusion_lookback_cap: 96
  use_guidance_channel: true
  disable_cross_attention: false
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    max_variates_by_dataset:
      ETTm1: 4
      weather: 4
      electricity: 4
      traffic: 4
      solar_Alabama: 2
      exchange_rate: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

training:
  diffusion_ema_decay: 0.99
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
