# Ordinal unique-seg bridge: restore early-July guidance / epsilon / [8,8] /
# loss_weighting=none / S=20 while keeping lb336 + ordinal + patch_refine AR.
# Fresh synth pretrain is required (channel count, patch size, prediction target).
extends: configs/binary_patch_refine_lb336_hz96_ordinal_tuned.yaml
replace_phases: true

training:
  n_finetune_hp_trials: 4
  finetune_max_micro_batch: 2048

wandb:
  tags: [patch_refine, ordinal_norm, lb336_hz96, tuned, guided_p8, epsilon, none_weight, cross_attn]

experiment:
  name: binary-patch-refine-lb336-hz96-ordinal-tuned-guided-p8
  experiment_name: binary_patch_refine_lb336_hz96_ordinal_tuned_guided_p8
  use_window_normalization: false
  use_ordinal_window_norm: true
  ordinal_ood_shift_causal_only: true
  patch_refine_unique_segments: true
  patch_refine_prev_cond_dropout: 0.5
  dit_patch_size: [8, 8]
  use_guidance_channel: true
  guidance_type: patch_decoder
  guidance_placement: canvas
  disable_cross_attention: false   # early-July: channel ghost + cross-variate attn
  prediction_target: epsilon
  loss_weighting: none

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4
    shared_cache: true
    require_reuse_pretrain: false

  - phase: patch_guidance_finetune_hp
    n_trials: 4
    max_epochs: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_eff_batch_univariate_ema
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [512, 1024, 2048]
    ema_decay_grid: [0.0, 0.99, 0.995, 0.999]
    prediction_target: epsilon
    loss_weighting: none
    binary_noise_schedule: linear

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 4
    max_epochs: 20
    patience: 8
    search_space: lr_eff_batch_univariate_ema
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [64, 128, 256]
    ema_decay_grid: [0.0, 0.99, 0.995, 0.999]
    prediction_target: epsilon
    loss_weighting: none
    binary_noise_schedule: linear

  - phase: staged_eval
    eval_test_fraction: 0.25
    test_stride: 16
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
    probe_eval_batch_size: true
