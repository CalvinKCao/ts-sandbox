# Dynamic 7 PAM variates: same 10+10 HP search as traffic
# ...traffic_7v_rep...hpsearch_u1186_1886_sel_amse (job 5503757).
# Epoch val / early-stop / best.pt stay occupancy BCE. Optuna trial ranking
# uses n=1 window val anchor MSE (unique-seg cut: L=600 × dynamic_500K ×
# stride-1 is ~349k segments and CPU-spins; Killarney 5527088, 10.5h still
# on iTrans trial 0/1).
# This leaf caps train/val to 20k / 3k seeded windows (existing
# train_max_windows knob — not a chronological series slice). 20k/349k of
# 5527088 iTrans plus traffic-7v 10+10 (5453867 7:42 on ~11k windows) → ~12h.
# Search: lr / U×{1,2,4} / EMA 0.995, coarse max_scale [3, 7], fine
# patch_h {16,32,48,64}. U copied from traffic 7v L40S (1186/1886).
# Native L=600 H=300. Eval test_stride 300 matches the table dynamic leaf.
# Indices from reports/dynamic-7v-representative/ (train-split PAM, seed 42).
