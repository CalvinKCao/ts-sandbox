  tags: [traffic, traffic_7v_rep, canvas128, p32x6, nopretrain, from_random_init, hz720, nostitch, itrans_guid, hpsearch, lr_batch_ema, ema995, max_scale_3_7, patch_h_16_32_48_64, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile, u1186_1886, sel_amse]

experiment:
