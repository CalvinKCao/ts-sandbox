    ema_decay: 0.995
    ema_decay_grid: [0.995]
    hp_max_scale_min: 3.0
    hp_max_scale_max: 7.0
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
        ema_decay: 0.995
        max_scale: 3.5
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

