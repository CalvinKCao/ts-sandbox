# Traffic 7 PAM variates: same 10+10 HP search as
# ...hpsearch_u1186_1886. Epoch val / early-stop / best.pt stay occupancy BCE
# (no generate). Optuna trial ranking only uses n=1 unique-seg (fine) /
# window (coarse) val anchor MSE — mean over samples×variates×horizon,
# matching table aMSE. Occupancy BCE is still logged as val_loss.
# Search space is the original 7v: lr / U×{1,2,4} / EMA 0.995, plus coarse
# max_scale [3, 7] and fine patch_h {16,32,48,64} (not frozen).
# Indices from reports/traffic-7v-representative/ (train-split PAM k-medoids).
# Distinct stem vs 5453867 / 5488720 / 5501971.
