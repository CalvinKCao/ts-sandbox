# Dynamic 7 PAM variates. Killarney L40S.
# Search: lr_eff_batch_univariate + log-uniform window_norm_std_floor.
# 1x U is probed on the GPU at phase start (no hardcoded U, no 2x/4x).
# Floor hi = ~1% lookback-std cutoff on a 4k-window train subset
# (reports/dynamic-7v-representative/window_norm_std_floor_cutoff.md).
# Native L=600 H=300. Optuna uses ~20k train windows (hp_train_fraction of
# the ~349k stride-1 train set). After search, refit_best retrains the
# winner from_random_init on the full train/val split (no 20k/3k cap).
# iTrans HP stays 20k/3k (uncapped iTrans is a multi-day CPU spin).
# Indices from reports/dynamic-7v-representative/ (train-split PAM, seed 42).
extends: configs/binary_window_norm_patch_refine_canvas128_p32x6_allv_fullT_hz720_nostitch_nopretrain_fixedhp_r0_ms35_kv.yaml
replace_phases: true

geometry:
  lookback_length: 600
  forecast_length: 300
  lookback_overlap: 8
  diffusion_lookback_cap: 600
  past_cond_resize_to_horizon: false
  itrans_lookback_length: 600

wandb:
  tags: [dynamic, dynamic_7v_rep, canvas128, p32x6, nopretrain, from_random_init, lb600, hz300, nostitch, itrans_guid, hpsearch, lr_eff_batch_univariate, std_floor_logu, probe_u1x, hp_w20k, refit_best, eval_anchor_only, n_samp_1, train_time_coverage_1, r0, cache_cond_kv, compile, sel_amse, killarney_l40s]

experiment:
  dataset: dynamic
  name: binary-c128-p32x6-dynamic-7v-rep-lb600-hz300-hpsearch-lr-stdfloor
  experiment_name: binary_window_norm_patch_refine_canvas128_p32x6_dynamic_7v_rep_lb600_hz300_nostitch_nopretrain_hpsearch_lr_stdfloor
  n_variates: 7
  patch_refine_patch_height: 32
  patch_refine_unique_segments: false
  config_nickname: c128-p32-dynamic-7v-rep-lb600-hz300-hpsearch-lr-stdfloor
  data_subset_by_dataset:
    dynamic:
      subset_id: dynamic_7v_rep_s1_sel_amse_hpw20k_refitfull_stdfloor
      all_variates: false
      variate_indices: [0, 3, 6, 7, 9, 13, 14]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 300
      train_max_windows: null
      val_max_windows: null

phases:
  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10
    train_max_windows: 20000
    val_max_windows: 3000

  - phase: diffusion_coarse_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate
    selection_metric: staged_anchor_mse
    hp_anchor_eval_val_fraction: 0.04
    probe_univariate_micro_batch_once: true
    hp_train_fraction: 0.05729
    refit_best_max_epochs: 20
    refit_best_patience: 5
    hp_lr_min: 1.6260630766856958e-5
    hp_lr_max: 1.6260630766856958e-3
    effective_univariate_batch_multipliers: [1]
    hp_window_norm_std_floor_min: 1.0e-6
    hp_window_norm_std_floor_max: 5.7e-4
    ema_decay: 0.995
    enqueue_trials:
      - learning_rate: 0.00016260630766856958
    min_snr_gamma: 5.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: diffusion_patch_refine_finetune_hp
    from_random_init: true
    n_trials: 10
    max_epochs: 20
    patience: 5
    pruner: median
    pruner_n_startup_trials: 3
    pruner_n_warmup_steps: 8
    search_space: lr_eff_batch_univariate
    selection_metric: staged_anchor_mse
    hp_anchor_eval_val_fraction: 0.04
    probe_univariate_micro_batch_once: true
    hp_train_fraction: 0.05729
    refit_best_max_epochs: 20
    refit_best_patience: 5
    hp_lr_min: 7.817554354066733e-5
    hp_lr_max: 7.817554354066733e-3
    effective_univariate_batch_multipliers: [1]
    hp_window_norm_std_floor_min: 1.0e-6
    hp_window_norm_std_floor_max: 5.7e-4
    ema_decay: 0.995
    enqueue_trials:
      - learning_rate: 0.0007817554354066733
    min_snr_gamma: 2.0
    binary_noise_schedule: linear
    loss_weighting: none
    prediction_target: epsilon
    binary_length_mode: none
    binary_length_g: 1.0
    binary_length_scale: 1.0

  - phase: staged_eval
    anchor_only: true
    eval_test_fraction: 1.0
    test_stride: 300
    eval_progress_key: canvas128_p32x6_dynamic_7v_rep_lb600_hz300_hpsearch_lr_stdfloor_refitfull_s300_n1_anchor
    n_samples: 1
    probabilistic_n_samples: 0
    tune_sampler: false
    probabilistic_sampler: anchor
    batch_size_by_dataset:
      dynamic: 1
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: true
