extends: configs/binary_anchor_ar_patch_decoder_ctx.yaml

training:
  diffusion_effective_batch_multiplier: 1.5

wandb:
  enabled: true
  project: ts-sandbox-leaderboard
  tags: [patch_decoder, healthy_norm]

experiment:
  name: binary-anchor-ar-patch-decoder-healthy-norm
  experiment_name: binary_anchor_ar_patch_decoder_ctx_healthy_norm
  guidance_type: patch_decoder
  mmpd_patch_size: 12
  # Low-variance past: std_eff=1.0 z-unit when past_std < threshold (see viz calibration).
  window_norm_low_var_threshold: 0.3
  window_norm_low_var_unit_std: 1.0
  max_scale_by_dataset:
    dynamic: 4.24
    electricity: 2.92

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    reuse_pretrain_from_config: binary_anchor_ar_patch_decoder_ctx

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx

  - phase: diffusion_coarse_finetune_hp
    reuse_tuned_params_from: binary_anchor_ar_patch_decoder_ctx
    reuse_tuned_params_from_by_dataset:
      dynamic: binary_anchor_ar_patch_decoder_ctx_full_hp
      electricity: binary_anchor_ar_patch_decoder_ctx
    retrain: true
    max_epochs: 20
    patience: 8

  - phase: diffusion_fine_finetune_hp
    reuse_tuned_params_from: binary_anchor_ar_patch_decoder_ctx
    reuse_tuned_params_from_by_dataset:
      dynamic: binary_anchor_ar_patch_decoder_ctx_full_hp
      electricity: binary_anchor_ar_patch_decoder_ctx
    retrain: true
    max_epochs: 20
    patience: 8

  - phase: staged_eval
    eval_test_fraction: 1.0
    eval_test_fraction_by_dataset:
      dynamic: 0.2
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
