# H=96 (no stitch) sibling of the hz720 stitch leaf crop-cap policy.
# Crop caps vs H=720 ETTh1 full-pool crops (~53039 train / ~15071 val):
# 1× fat-V (electricity, traffic, PeMS, solar); 2× weather/dynamic + all ETT
# (V=7 → 15153/4305). exchange stays full-pool null. ETTm*/PeMS stride→1
# (subset_id drops _s3/_s4/_s2; isolates from parent lr10 dense-stride ckpts).
# Leaves the old uncapped/4× lr10 baselines alone.
extends: configs/binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10.yaml

geometry:
  forecast_length: 96
  horizon_stitch: false

wandb:
  tags: [all_variates, randwin, lr10, canvas128, p64x6, win_frac_1, patch_frac_1, lr_batch_ema, anchor_every4, eval_s1_n10_steps4, median_pruner, patience_5, from_pretrain, hz96, caps_crops_1x2x_etth1]

experiment:
  name: binary-window-norm-patch-refine-c128-allv-randwin-lr10-cap1x2x
  experiment_name: binary_window_norm_patch_refine_canvas128_p64x6_allv_randwin_lr10_cap1x2x
  data_subset_by_dataset:
    # 2× ETTh1 H720 crops / V (V=7 → floor(106071/7), floor(30135/7))
    ETTh1:
      train_max_windows: 15153
      val_max_windows: 4305
    ETTh2:
      train_max_windows: 15153
      val_max_windows: 4305
    ETTm1:
      subset_id: ETTm1_allv_randwin
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 15153
      val_max_windows: 4305
    ETTm2:
      subset_id: ETTm2_allv_randwin
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 15153
      val_max_windows: 4305
    exchange_rate:
      train_max_windows: null
      val_max_windows: null
    # 1× ETTh1 H720 crops / V
    electricity:
      train_max_windows: 165
      val_max_windows: 46
    traffic:
      train_max_windows: 61
      val_max_windows: 17
    PeMS:
      subset_id: PeMS_allv_randwin
      train_stride: 1
      val_stride: 1
      test_stride: 1
      train_max_windows: 172
      val_max_windows: 49
    solar_Alabama:
      train_max_windows: 387
      val_max_windows: 110
    # 2× ETTh1 H720 crops / V
    weather:
      train_max_windows: 5051
      val_max_windows: 1435
    dynamic:
      train_max_windows: 6239
      val_max_windows: 1773

phases:
  - phase: staged_eval
    eval_progress_key: canvas128_allv_randwin_lr10_cap1x2x_s1_n10_steps4
