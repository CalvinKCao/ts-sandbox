extends: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo.yaml

experiment:
  window_norm_center: last
  name: binary-anchor-stationary-flat-subsets-grad-accum-150-lr-lo-last-norm
  experiment_name: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo_last_norm

# Reuse lr_lo iTrans; retrain diffusion with last-value window norm center.
phases:
  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo
  - phase: diffusion_coarse_finetune_hp
    reuse_tuned_params_from: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo
    retrain: true
    max_epochs: 20
    patience: 8
  - phase: diffusion_fine_finetune_hp
    reuse_tuned_params_from: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo
    retrain: true
    max_epochs: 20
    patience: 8
  - phase: diffusion_finer_finetune_hp
    reuse_tuned_params_from: binary_anchor_stationary_flat_subsets_grad_accum_150_lr_lo
    retrain: true
    max_epochs: 20
    patience: 8
