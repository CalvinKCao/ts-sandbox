extends: configs/binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid.yaml

# Single DiT on vertically stacked coarse∥fine canvas (1, 32, W).
# HP search mirrors mid coarse block; U grid expanded to {512,1024,2048}.

wandb:
  tags: [patch_decoder, ordinal_norm, lb336_hz720, uncompressed, vertical_dual, lr_eff_batch_univariate]

experiment:
  name: binary-anchor-ar-patch-decoder-lb336-hz720-ord-unc-bs-mid-vertical-dual
  experiment_name: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed_bs_mid_vertical_dual
  use_vertical_dual_concat: true
  image_height: 32
  coarse_image_height: 16
  fine_image_height: 16
  binary_use_boundary_weighted_bce: true
  binary_cdf_distance_alpha: 1.0
  anchor_mse_proxy_lambda: 0.5

phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: null

  - phase: patch_guidance_finetune_hp
    reuse_checkpoint_from_config: binary_anchor_ar_patch_decoder_ctx_lb336_hz720_ordinal_norm_uncompressed

  - phase: diffusion_vertical_dual_finetune_hp
    n_trials: 7
    max_epochs: 20
    patience: 8
    search_space: lr_eff_batch_univariate
    hp_lr_min: 5.0e-5
    hp_lr_max: 1.5e-3
    effective_univariate_batch_grid: [512, 1024, 2048]
    ema_decay: 0.995
    prediction_target: x0
    loss_weighting: min_snr
    min_snr_gamma: 2.0
    binary_noise_schedule: linear

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
