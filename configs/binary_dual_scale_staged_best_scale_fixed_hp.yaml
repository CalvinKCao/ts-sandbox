experiment:
  name: binary-dual-scale-staged-best-scale-fixed-hp
  experiment_name: binary-dual-scale-staged-best-scale-fixed-hp
  dataset: ETTh1
  diffusion_type: binary
  model_type: dit
  image_height: 16
  max_scale: 3.5
  window_norm_std_floor: 0.1
  # Cap-rate decision tree (train windows, std = max(past_std, 0.1)):
  # cap35 >= 10% -> min(8, ceil0.1 q99); >= 5% -> min(6, ceil0.1 q98); else 3.5.
  max_scale_by_dataset:
    ETTh1: 3.5
    ETTh2: 3.5
    ETTm1: 3.5
    ETTm2: 3.5
    illness: 3.5
    exchange_rate: 8.0
    weather: 7.9
    electricity: 3.5
    traffic: 3.5
    PeMS: 8.0
    solar_Alabama: 6.0
    dalia: 3.5
  dit_patch_size: [8, 8]
  use_dual_scale: false
  diffusion_stage: joint
  use_guidance_channel: false
  cfg_dropout: 0.0
  cfg_scale: 1.0
  use_cfg_inference: false
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  lookback_length: 96
  forecast_length: 96
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  data_subset:
    enabled: true
    target_dataset: ETTh1
    reduce_if_larger_than_target: true
    max_variates: 7
    variate_strategy: first
    subset_id_template: "{dataset}_{n_variates}v_s{sample_stride}"

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale

  - phase: itrans_finetune_hp
    reuse_checkpoint_from_config: binary_dual_scale_staged

  - phase: diffusion_coarse_finetune_hp
    reuse_tuned_params_from: binary_dual_scale_staged
    final_max_epochs: 20
    final_patience: 8

  - phase: diffusion_fine_finetune_hp
    reuse_tuned_params_from: binary_dual_scale_staged
    final_max_epochs: 20
    final_patience: 8

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 2
    n_samples: 1
    probabilistic_n_samples: 100
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    skip_eval_visualizations: true
