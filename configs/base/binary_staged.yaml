# Shared defaults for staged binary DiT pipeline runs.
# Leaf configs: `extends: base/binary_staged.yaml` then override name / arch knobs only.

training:
  pretrain_epochs: 10
  pretrain_diffusion_epochs: 20
  pretrain_diffusion_max_epochs: 20
  force_retrain_synthetic: true
  skip_synthetic_tuning: true
  use_hardcoded_synthetic_hp: true
  pretrain_synthetic_override: null
  synthetic_samples_full_cap: 50000
  synthetic_samples_hp_tune: 20000
  synthetic_samples_diff_tune: 10000
  synthetic_samples_min: 4096
  n_itrans_hp_trials: 10
  n_diffusion_hp_trials: 8
  n_finetune_hp_trials: 5
  itrans_hp_pretrain_max_epochs: 10
  itrans_hp_finetune_max_epochs: 10
  diffusion_hp_patience: 4
  hp_tune_epochs: 20
  hp_tune_patience: 15
  itrans_real_cold_start: true
  itrans_paper_batch_size: 32
  itrans_paper_lr_grid: [0.001, 0.0005, 0.0001]
  itrans_paper_dropout: 0.1
  diffusion_batch_size: 32
  diffusion_batch_sizes: [16]
  finetune_batch_sizes: [4, 8, 16]
  finetune_max_micro_batch: 2048
  finetune_hp_lr_min: 0.000003
  finetune_hp_lr_max: 0.0002
  use_amp: true
  use_gradient_checkpointing: true
  torch_compile: true
  unet_max_chunk_size: 128
  sequential_anchor_backward: false
  eval_num_samples: 30
  past_loss_weight: 0.3
  lr_scheduler_type: none
  lr_warmup_epochs: 0
  # 1 = one epoch is the full train set. Raise in a leaf so each epoch is a
  # disjoint group of constant-B batches (a full cycle still covers every window).
  # After each cycle, indices are reshuffled and batches are repacked.
  train_epoch_groups: 1
  # null = use train_epoch_groups as-is. Integer cap (bytes) computes N after
  # the batch probe so each packed group is <= this many fp32 past+future bytes.
  # When set, the cap wins over train_epoch_groups > 1.
  train_epoch_max_bytes: null
  max_scale_tuning: false
  max_scale_tuning_range: [2.5, 14.0]
  diffusion_ema_decay: 0.99

logging:
  diagnostics_enabled: true

visualization:
  enabled: true
  n_samples: 3
  n_dual_scale_vars: 3
  jpeg_dpi: 100
  dual_scale_sampler: anchor
  dual_scale_inference_steps: 20
  # Off by default (GPU-heavy). Smoke / local: set true or pass CLI override.
  viz_patch_boxes: false
  viz_patch_boxes_n_samples: 1
  # Point-acc stage: always emit top-gap binary↔MMPD + redbox (anchor ranking).
  # Requires visualization.mmpd_campaign_root_by_dataset[dataset] (or a global
  # mmpd_campaign_root). Unset for this dataset → skip; set but missing pack → fail.
  viz_binary_mmpd_gap: true
  viz_binary_mmpd_redbox: true
  viz_binary_mmpd_top_k: 10
  viz_binary_mmpd_min_spacing: 48
  viz_binary_mmpd_diff_mode: abs_diff
  viz_binary_mmpd_eval_test_stride: 4
  viz_binary_mmpd_variables_to_plot: 99
  viz_binary_mmpd_redbox_variables_to_plot: 0
  viz_binary_mmpd_smoke_top_k: 1
  viz_binary_mmpd_smoke_variables: 2
  mmpd_campaign_root: null
  mmpd_campaign_root_by_dataset: {}
  mmpd_config: configs/mmpd_decoder_flat_subsets_paper_lb336_hz96_matched_binary.yaml
  mmpd_config_suffix: mmpd_decoder_flat_subsets_paper_lb336_hz96_matched_binary

wandb:
  enabled: true
  project: ts-sandbox-leaderboard
  group: null
  tags: []

experiment:
  dataset: ETTh1
  n_variates: 7
  seed: 42
  seeds: [42]
  ckpt_config: null
  walltime: "3:00:00"
  diffusion_type: binary
  model_type: dit
  image_height: 16
  coarse_image_height: 16
  fine_image_height: 16
  staged_representation: value_precision
  max_scale: 3.5
  max_scale_by_dataset:
    ETTh1: 5.2
    ETTh2: 9.0
    ETTm1: 7.7
    ETTm2: 9.0
    illness: 6.3
    exchange_rate: 10.6
    weather: 9.3
    electricity: 5.4
    traffic: 6.0
    PeMS: 11.8
    PEMS03: 11.8
    PEMS07: 11.8
    PEMS08: 11.8
    solar_Alabama: 13.0
    dynamic: 6.0
  window_norm_std_floor: 0.1
  window_norm_center: mean
  dit_patch_size: [8, 8]
  dit_cond_patch_size: [8, 8]
  patch_refine_canvas_height: 256
  patch_refine_patch_height: 32
  patch_refine_patch_width: 8
  patch_refine_col_stride: 6
  patch_refine_unique_segments: false
  patch_refine_finetune_window_fraction: 1.0
  # Train-only: keep this fraction of unique-seg (B,V) crops per window.
  # Independent of window_fraction. 1.0 = all variate-crops.
  patch_refine_finetune_patch_fraction: 1.0
  dit_embed_dim: 384
  dit_depth: 8
  dit_num_heads: 6
  dit_mlp_ratio: 4.0
  dit_dropout: 0.0
  use_patch_refine_stage: true
  diffusion_stage: coarse
  cfg_dropout: 0.0
  deterministic_anchor_loss: true
  deterministic_anchor_lambda: 0.99
  deterministic_anchor_alpha: 0.0
  eval_sampler: anchor
  disable_cross_attention: false
  cross_variate_context_bias: 0.0
  use_window_normalization: true
  # window_norm_center: mean | last — subtract lookback mean (default) or last value before /std
  lookback_length: 96
  forecast_length: 96
  lookback_overlap: 8
  diffusion_lookback_cap: 0
  horizon_stitch: false
  horizon_chunk_inner: 96
  representation_time_stride: 1
  past_cond_resize_to_horizon: true
  itrans_lookback_length: null
  itrans_d_model: 512
  itrans_d_ff: 512
  itrans_e_layers: 4
  itrans_n_heads: 8
  binary_noise_schedule: linear
  # Length-dependent β remap for long maps (none = identity; power uses length_g).
  binary_length_mode: none
  binary_length_g: 1.0
  binary_length_scale: 1.0
  binary_length_g_by_dataset: {}
  binary_num_steps: 1000
  binary_beta_start: 1.0e-5
  binary_beta_end: 0.5
  prediction_target: epsilon
  loss_weighting: none
  min_snr_gamma: 5.0
  use_coordinate_channel: true
  window_stride: 1
  data_subset_by_dataset:
    ETTh1:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
    ETTh2:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
    ETTm1:
      variate_indices: [0, 1, 2, 3]
      n_variates: 4
      train_stride: 3
      val_stride: 3
      test_stride: 1
    ETTm2:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 4
      val_stride: 4
      test_stride: 1
    illness:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
    exchange_rate:
      variate_indices: [0, 1, 2, 3, 4, 5, 6, 7]
      n_variates: 8
      train_stride: 1
      val_stride: 1
      test_stride: 1
    weather:
      variate_indices: [0, 1, 2, 3]
      n_variates: 4
      train_stride: 2
      val_stride: 2
      test_stride: 1
    electricity:
      variate_indices: [0, 1, 2, 3]
      n_variates: 4
      train_stride: 1
      val_stride: 1
      test_stride: 1
    traffic:
      variate_indices: [0, 1, 2, 3]
      n_variates: 4
      train_stride: 1
      val_stride: 1
      test_stride: 1
    PeMS:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1
    solar_Alabama:
      variate_indices: [0, 1]
      n_variates: 2
      train_stride: 1
      val_stride: 1
      test_stride: 1
    dynamic:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 60
      val_stride: 60
      test_stride: 480
    coverage_synth:
      variate_indices: [0, 1, 2, 3, 4, 5, 6]
      n_variates: 7
      train_stride: 1
      val_stride: 1
      test_stride: 1

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale_staged
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: patch_guidance_finetune_hp
    n_trials: 10

  - phase: diffusion_coarse_finetune_hp
    n_trials: 20
    max_epochs: 20
    patience: 8
    search_space: default

  - phase: diffusion_patch_refine_finetune_hp
    n_trials: 20
    max_epochs: 20
    patience: 8
    search_space: default

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: quad_t
    probabilistic_num_inference_steps: 20
    # Small-V canvas128 (7v) L40S probe: max_fit=54, n_samples=20 -> 2
    batch_size: 2
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
