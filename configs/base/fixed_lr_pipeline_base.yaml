extends: base/binary_staged.yaml

training:
  itrans_paper_lr_grid: [0.001]
  finetune_hp_lr_min: 0.00003
  finetune_hp_lr_max: 0.00003

phases:
  - phase: staged_diffusion_pretrain
    phase1_config_name: binary_dual_scale
    n_samples: 10000
    epochs: 20
    patience: 4

  - phase: itrans_finetune_hp
    n_trials: 1
    max_epochs: 10
    cold_start: true

  - phase: diffusion_coarse_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_fine_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: diffusion_finer_finetune_hp
    n_trials: 1
    max_epochs: 20
    patience: 8
    search_space: lr_only

  - phase: staged_eval
    eval_test_fraction: 1.0
    test_stride: 4
    n_samples: 1
    probabilistic_n_samples: 20
    tune_sampler: false
    probabilistic_sampler: dpmpp
    probabilistic_num_inference_steps: 20
    batch_size: 8
    gmm_components: 10
    topk_max: 3
    skip_eval_visualizations: false
