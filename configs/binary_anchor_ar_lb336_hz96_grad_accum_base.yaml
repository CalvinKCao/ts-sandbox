extends: binary_anchor_ar_lb336_hz96.yaml

wandb:
  project: ts-sandbox-binary-anchor-ar-windows-grad-accum

# LB336/H96: reuse ema099 pretrain; iTrans must train at seq_len=336.
phases:
  - phase: staged_diffusion_pretrain
    reuse_pretrain_from_config: binary_anchor_stationary_flat_subsets_ema099
  - phase: itrans_finetune_hp
    n_trials: 10
    max_epochs: 10
    cold_start: true
  - phase: diffusion_coarse_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: diffusion_fine_finetune_hp
    n_trials: 5
    max_epochs: 20
    patience: 8
    search_space: lr_only
  - phase: staged_eval
